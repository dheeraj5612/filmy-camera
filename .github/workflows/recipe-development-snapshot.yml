name: Recipe development source snapshot
on:
  push:
    branches: [feat/recipe-library-packs-fidelity]
    paths: [.github/workflows/recipe-development-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source for offline development and verification
        run: git archive --format=tar.gz -o /tmp/filmy-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: recipe-development-source
          path: /tmp/filmy-source.tar.gz
          retention-days: 1
