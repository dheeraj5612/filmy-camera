name: Fuji development snapshot

on:
  push:
    branches: [feat/fuji-shooting-system]
    paths: [.github/workflows/fuji-development-snapshot.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Archive text sources for offline development
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import tarfile
          extensions = {'.swift', '.metal', '.pbxproj', '.xcscheme', '.plist', '.yml', '.yaml', '.py', '.sh', '.md', '.json', '.xcconfig'}
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with tarfile.open('filmy-sources.tgz', 'w:gz') as archive:
              for name in files:
                  path = pathlib.Path(name)
                  if name and path.is_file() and path.suffix in extensions:
                      archive.add(path, arcname=name)
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: filmy-development-sources
          path: filmy-sources.tgz
          retention-days: 1
          if-no-files-found: error
