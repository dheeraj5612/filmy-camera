name: Fuji Shooting Checks

on:
  push:
    branches: [feature/fuji-shooting-system]
    paths: ['.github/workflows/fuji-shooting-checks.yml']

permissions:
  contents: write

concurrency:
  group: fuji-shooting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-membership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/fuji-shooting-system
      - name: Add deterministic XcodeProj source references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import md5
          import re
          p = Path('FilmyCamera.xcodeproj/project.pbxproj')
          s = p.read_text()
          if 'FujiShootingSettings.swift in Sources' in s:
              raise SystemExit(0)
          def reference(kind, ids):
              acronym = ''.join(c for c in kind.removeprefix('PBX').removeprefix('XC') if c.isupper())
              return md5(f'{acronym}_{kind}-{"-".join(ids)}_1'.encode()).hexdigest().upper()[:24]
          assert reference('PBXFileReference', ['FilmyCamera','FilmyCamera','Services','CompositionAssistStore.swift']) == '5DEAF80BF98F3BCC9BB1DBC1'
          assert reference('PBXBuildFile', ['FilmyCamera','FilmyCamera','Sources','2742A27161237B210E4D8A3C']) == 'F84D685F791EF68BD232EC02'
          new = [(f.name, 'FilmyCamera', ['FilmyCamera','Shooting']) for f in sorted(Path('FilmyCamera/Shooting').glob('*.swift'))]
          new.append(('FujiShootingTests.swift', 'FilmyCameraTests', ['FilmyCameraTests']))
          entries = []
          for name, target, groups in new:
              fr = reference('PBXFileReference', ['FilmyCamera'] + groups + [name])
              bf = reference('PBXBuildFile', ['FilmyCamera', target, 'Sources', fr])
              assert fr not in s and bf not in s
              entries.append((name, target, fr, bf))
          def insert_section(section, lines):
              global s
              m = re.search(rf'(/\* Begin {section} section \*/\n)(.*?)(/\* End {section} section \*/)', s, re.S)
              assert m
              s = s[:m.start()] + m[1] + ''.join(sorted(m[2].splitlines(keepends=True) + lines)) + m[3] + s[m.end():]
          insert_section('PBXBuildFile', [f'\t\t{bf} /* {name} in Sources */ = {{isa = PBXBuildFile; fileRef = {fr} /* {name} */; }};\n' for name,_,fr,bf in entries])
          insert_section('PBXFileReference', [f'\t\t{fr} /* {name} */ = {{isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = {name}; sourceTree = "<group>"; }};\n' for name,_,fr,_ in entries])
          def add_children(object_id, lines, field='children'):
              global s
              m = re.search(rf'(\t\t{object_id} /\*.*?\*/ = \{{.*?\b{field} = \(\n)(.*?)(\t\t\t\);)', s, re.S)
              assert m
              items = sorted(m[2].splitlines(keepends=True) + lines, key=lambda line: line.split('/* ',1)[1].casefold())
              s = s[:m.start()] + m[1] + ''.join(items) + m[3] + s[m.end():]
          for target, phase in [('FilmyCamera','32C8A77D3F2700871BE5B3CA'), ('FilmyCameraTests','1351B15A91B0887375B8F106')]:
              add_children(phase, [f'\t\t\t\t{bf} /* {name} in Sources */,\n' for name,t,fr,bf in entries if t == target], 'files')
          add_children(reference('PBXGroup',['FilmyCamera','FilmyCameraTests']), [f'\t\t\t\t{fr} /* {name} */,\n' for name,t,fr,bf in entries if t == 'FilmyCameraTests'])
          sg = reference('PBXGroup',['FilmyCamera','FilmyCamera','Shooting'])
          needle = '\t\t\t\t325853F97B7E117222F4E01E /* Services */,\n'
          assert s.count(needle) == 1
          s = s.replace(needle, needle + f'\t\t\t\t{sg} /* Shooting */,\n')
          group = f'\t\t{sg} /* Shooting */ = {{\n\t\t\tisa = PBXGroup;\n\t\t\tchildren = (\n'
          group += ''.join(f'\t\t\t\t{fr} /* {name} */,\n' for name,t,fr,bf in entries if t == 'FilmyCamera')
          group += '\t\t\t);\n\t\t\tpath = Shooting;\n\t\t\tsourceTree = "<group>";\n\t\t};\n'
          m = re.search(r'(/\* Begin PBXGroup section \*/\n)(.*?)(/\* End PBXGroup section \*/)', s, re.S)
          assert m
          blocks = re.findall(r'\t\t[0-9A-F]{24}.*?\n\t\t};\n', m[2], re.S)
          assert ''.join(blocks) == m[2]
          s = s[:m.start()] + m[1] + ''.join(sorted(blocks + [group])) + m[3] + s[m.end():]
          definitions = re.findall(r'^\t\t([0-9A-F]{24}) /\*.*?\*/ = ', s, re.M)
          assert len(definitions) == len(set(definitions))
          for name,t,fr,bf in entries:
              assert s.count(f'{fr} /* {name} */') == 3
              assert s.count(f'{bf} /* {name} in Sources */') == 2
          p.write_text(s)
          print('Ten source memberships added with verified deterministic references.')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FilmyCamera.xcodeproj
          if ! git diff --cached --quiet; then
            git commit -m 'build: register Fuji shooting sources and regression tests in Xcode'
            git push origin HEAD:refs/heads/feature/fuji-shooting-system
          fi
      - name: Validate test routing
        run: python3 -m unittest discover -s scripts/testing -p 'test_*.py' -v

  native-validation:
    needs: project-membership
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/fuji-shooting-system
      - name: Build and run shooting regression tests
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project FilmyCamera.xcodeproj -scheme FilmyCamera -destination 'platform=iOS Simulator,name=iPhone 16 Pro' -parallel-testing-enabled NO -maximum-parallel-testing-workers 1 -only-testing:FilmyCameraTests/FujiShootingTests -resultBundlePath "$RUNNER_TEMP/FujiTests.xcresult" test CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/fuji-build.log"
      - name: Summarize diagnostics
        if: always()
        run: |
          grep -E 'error:|warning:|Test Case|Executed |TEST SUCCEEDED|TEST FAILED' "$RUNNER_TEMP/fuji-build.log" > "$RUNNER_TEMP/fuji-diagnostics.txt" || true
          cat "$RUNNER_TEMP/fuji-diagnostics.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/filmy-tested-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuji-native-validation
          path: |
            ${{ runner.temp }}/fuji-build.log
            ${{ runner.temp }}/fuji-diagnostics.txt
            ${{ runner.temp }}/FujiTests.xcresult
            ${{ runner.temp }}/filmy-tested-source.tar.gz
          retention-days: 7
