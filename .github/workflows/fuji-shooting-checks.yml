name: Fuji Shooting Checks

on:
  push:
    branches: [feature/fuji-shooting-system]
  pull_request:
    paths:
      - 'FilmyCamera/**'
      - 'FilmyCameraTests/**'
      - '.github/workflows/fuji-shooting-checks.yml'

permissions:
  contents: read

concurrency:
  group: fuji-shooting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source for reproducible integration checks
        run: git archive --format=tar.gz HEAD > /tmp/filmy-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: filmy-source
          path: /tmp/filmy-source.tar.gz
          retention-days: 2
