name: Vivid Slide targeted repair validation

# Temporary branch-only validation harness. Removed before the final PR.
on:
  push:
    branches: [fix/vivid-slide-red-speckles]
    paths: [.github/workflows/vivid-slide-repair.yml]

permissions:
  contents: read

jobs:
  repair-and-test:
    if: github.repository == 'dheeraj5612/filmy-camera' && github.ref == 'refs/heads/fix/vivid-slide-red-speckles'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      XCODEGEN_VERSION: 2.45.4
      XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
      XCODEGEN_BINARY_SHA256: 6aa2b4da95304b343bea12890c59f9655aa428c08b351d57d592cfab4e88a9f1
    steps:
      - name: Check out only the repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/vivid-slide-red-speckles
          fetch-depth: 0

      - name: Apply exact source repair and register regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          renderer = Path('FilmyCamera/Services/FilmRenderer.swift')
          model = Path('FilmyCamera/Models/FilmRecipe.swift')
          suites = Path('scripts/testing/suites.json')
          source = renderer.read_text()
          if 'let highlightValues = image' not in source:
              assert subprocess.check_output(['git', 'hash-object', str(renderer)], text=True).strip() == '2240585b8d3156f3a8538aba2a073ebfa0dd6749'
              old = '''        let highlightMask = image
                      .applyingFilter("CIColorControls", parameters: [
                          kCIInputSaturationKey: 0,
                          kCIInputContrastKey: 2.4,
                          kCIInputBrightnessKey: -1.15
                      ])
                      .applyingFilter("CIMaskToAlpha")
                      .applyingFilter("CIGaussianBlur", parameters: ['''
              new = '''        let highlightValues = image
                      .applyingFilter("CIColorControls", parameters: [
                          kCIInputSaturationKey: 0,
                          kCIInputContrastKey: 2.4,
                          kCIInputBrightnessKey: -1.15
                      ])
                  // Contrast/brightness can produce negative mask values in
                  // shadows. Bound coverage before the blur, not afterward:
                  // negative lobes must never cancel neighboring highlights.
                  // Keep this an opaque grayscale mask for CIBlendWithMask.
                  // CIMaskToAlpha stores coverage in alpha instead of RGB and
                  // is not interchangeable with a grayscale-mask contract.
                  let highlightMask = clampOutput(toNormalizedRange: highlightValues)
                      .clampedToExtent()
                      .applyingFilter("CIGaussianBlur", parameters: ['''
              assert source.count(old) == 1
              source = source.replace(old, new)
              assert source.count('    private static func applyHalation(') == 1
              source = source.replace('    private static func applyHalation(', '    static func applyHalation(')
              renderer.write_text(source)
          content = model.read_text()
          if '"core-image-parametric-v9"' in content:
              assert subprocess.check_output(['git', 'hash-object', str(model)], text=True).strip() == '8a4572246908b1085c292efc3c6a115ae20983e6'
              assert content.count('public static let rendererVersion = "core-image-parametric-v9"') == 1
              model.write_text(content.replace('public static let rendererVersion = "core-image-parametric-v9"', 'public static let rendererVersion = "core-image-parametric-v10"'))
          content = suites.read_text()
          if 'FilmyCameraTests/HalationArtifactRegressionTests' not in content:
              anchor = '    "FilmyCameraTests/RendererOutputBoundsTests": "integration",\n'
              assert content.count(anchor) == 1
              suites.write_text(content.replace(anchor, anchor + '    "FilmyCameraTests/HalationArtifactRegressionTests": "integration",\n'))
          PY

      - name: Install and verify the repository's pinned XcodeGen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          [[ "$(xcodebuild -version | awk '/^Xcode / {print $2; exit}')" == 16.4 ]]
          archive_path="${RUNNER_TEMP}/xcodegen.zip"
          gh release download "${XCODEGEN_VERSION}" --repo yonaskolb/XcodeGen --pattern xcodegen.zip --output "${archive_path}"
          echo "${XCODEGEN_SHA256}  ${archive_path}" | shasum -a 256 --check
          mkdir -p .ci
          unzip -q "${archive_path}" -d .ci
          echo "${XCODEGEN_BINARY_SHA256}  .ci/xcodegen/bin/xcodegen" | shasum -a 256 --check
          .ci/xcodegen/bin/xcodegen generate --spec project.yml

      - name: Commit only repaired source and test registration to the repair branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add FilmyCamera/Services/FilmRenderer.swift FilmyCamera/Models/FilmRecipe.swift scripts/testing/suites.json FilmyCamera.xcodeproj
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fix bounded grayscale halation masks and invalidate stale thumbnails'
            git push origin HEAD:refs/heads/fix/vivid-slide-red-speckles
          fi
          git rev-parse HEAD | tee "${RUNNER_TEMP}/vivid-tested-commit.txt"
          .ci/xcodegen/bin/xcodegen generate --spec project.yml
          git diff --exit-code -- FilmyCamera.xcodeproj

      - name: Validate repository test routing
        run: python3 -m unittest discover -s scripts/testing -p 'test_*.py' -v

      - name: Boot an isolated iOS 18.5 simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl create Vivid-Slide-Regression com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro com.apple.CoreSimulator.SimRuntime.iOS-18-5)"
          echo "device_id=${device_id}" >> "${GITHUB_OUTPUT}"
          xcrun simctl boot "${device_id}"
          xcrun simctl bootstatus "${device_id}" -b

      - name: Run repaired renderer and related integration regressions
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test -project FilmyCamera.xcodeproj -scheme FilmyCamera \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -derivedDataPath "${RUNNER_TEMP}/VividDerivedData" \
            -resultBundlePath "${RUNNER_TEMP}/VividFixed.xcresult" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
            -only-testing:FilmyCameraTests/HalationArtifactRegressionTests \
            -only-testing:FilmyCameraTests/RendererOutputBoundsTests \
            -only-testing:FilmyCameraTests/ColorSpaceBoundaryTests \
            -only-testing:FilmyCameraTests/PhotoOutputEncoderTests \
            2>&1 | tee "${RUNNER_TEMP}/vivid-fixed.log"
          xcrun xcresulttool get test-results summary --path "${RUNNER_TEMP}/VividFixed.xcresult" --format json | tee "${RUNNER_TEMP}/vivid-fixed-summary.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          summary = json.loads((Path(os.environ['RUNNER_TEMP']) / 'vivid-fixed-summary.json').read_text())
          assert summary['passedTests'] >= 12 and summary['failedTests'] == 0 and summary['skippedTests'] == 0, summary
          PY

      - name: Prove regressions fail against the previous halation implementation
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        shell: bash
        run: |
          set -euo pipefail
          renderer=FilmyCamera/Services/FilmRenderer.swift
          cp "${renderer}" "${RUNNER_TEMP}/FilmRenderer.fixed.swift"
          trap 'cp "${RUNNER_TEMP}/FilmRenderer.fixed.swift" "${renderer}"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          old = subprocess.check_output(['git', 'show', 'f9c15224e1a81fa6740c2953cae8992355b94ede:FilmyCamera/Services/FilmRenderer.swift'], text=True)
          assert old.count('    private static func applyHalation(') == 1
          Path('FilmyCamera/Services/FilmRenderer.swift').write_text(old.replace('    private static func applyHalation(', '    static func applyHalation('))
          PY
          set +e
          xcodebuild test -project FilmyCamera.xcodeproj -scheme FilmyCamera \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -derivedDataPath "${RUNNER_TEMP}/VividDerivedData" \
            -resultBundlePath "${RUNNER_TEMP}/VividOldMask.xcresult" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
            -only-testing:FilmyCameraTests/HalationArtifactRegressionTests/testHalationIsIdentityForNoisyShadowsAndMidtones \
            -only-testing:FilmyCameraTests/HalationArtifactRegressionTests/testUniformHighlightMatchesBoundedScreenEquationIncludingImageEdges \
            -only-testing:FilmyCameraTests/HalationArtifactRegressionTests/testTrueHighlightsStillProduceLocalizedRedGlow \
            2>&1 | tee "${RUNNER_TEMP}/vivid-old-mask.log"
          test_status=${PIPESTATUS[0]}
          set -e
          [[ "${test_status}" -ne 0 ]]
          xcrun xcresulttool get test-results summary --path "${RUNNER_TEMP}/VividOldMask.xcresult" --format json | tee "${RUNNER_TEMP}/vivid-old-mask-summary.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          summary = json.loads((Path(os.environ['RUNNER_TEMP']) / 'vivid-old-mask-summary.json').read_text())
          # Compile/setup failures are not evidence that a regression detects
          # the old artifact. Require actual executed XCTest failures.
          assert summary['failedTests'] > 0 and summary['passedTests'] + summary['failedTests'] == 3, summary
          PY

      - name: Upload inspectable test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: vivid-slide-regression-evidence
          path: |
            ${{ runner.temp }}/vivid-*.log
            ${{ runner.temp }}/vivid-*.json
            ${{ runner.temp }}/vivid-tested-commit.txt
            ${{ runner.temp }}/Vivid*.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Remove only this job's simulator
        if: always() && steps.simulator.outputs.device_id != ''
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          xcrun simctl shutdown "${DEVICE_ID}" || true
          xcrun simctl delete "${DEVICE_ID}"
