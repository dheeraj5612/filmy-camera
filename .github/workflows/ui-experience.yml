name: UI experience evidence

on:
  pull_request:
    paths:
      - 'FilmyCamera/**'
      - 'FilmyCameraUITests/**'
      - 'FilmyCamera.xcodeproj/**'
      - '.github/workflows/ui-experience.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-experience-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui-screenshots:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        device: ["iPhone 16 Pro", "iPad Pro 13-inch (M4)"]
    env:
      SIMULATOR_DEVICE_NAME: ${{ matrix.device }}
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-2
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Capture simulator UI, not a design mockup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ui-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/ui-evidence/source-sha.txt"
          xcodebuild -version > "$RUNNER_TEMP/ui-evidence/xcode.txt"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/ui-evidence/devices.json"
          python3 - <<'PYBOOT'
          import json, os, pathlib, subprocess
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ui-evidence'
          runtime = os.environ['SIMULATOR_RUNTIME']
          devices = json.loads((output / 'devices.json').read_text())['devices']
          matches = [d for d in devices.get(runtime, []) if d['name'] == os.environ['SIMULATOR_DEVICE_NAME'] and d['isAvailable']]
          if len(matches) != 1:
              raise SystemExit('Expected exactly one matching device type on the pinned iOS 26.2 runtime')
          name = 'Filmy-UI-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          device_id = subprocess.check_output(['xcrun', 'simctl', 'create', name, matches[0]['deviceTypeIdentifier'], runtime], text=True, timeout=45).strip()
          # This is a newly created, job-owned simulator. Cleanup never touches a caller's device.
          (output / 'device-id.txt').write_text(device_id + '\n')
          (output / 'runtime.txt').write_text(runtime + '\n')
          with (output / 'boot.log').open('w') as log:
              subprocess.run(['xcrun', 'simctl', 'boot', device_id], stdout=log, stderr=subprocess.STDOUT, timeout=45, check=True)
              subprocess.run(['xcrun', 'simctl', 'bootstatus', device_id, '-b'], stdout=log, stderr=subprocess.STDOUT, timeout=300, check=True)
          PYBOOT
          device_id="$(cat "$RUNNER_TEMP/ui-evidence/device-id.txt")"
          xcodebuild -project FilmyCamera.xcodeproj -scheme FilmyCamera \
            -destination "platform=iOS Simulator,id=$device_id,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/FilmyUIBuild" \
            -resultBundlePath "$RUNNER_TEMP/FilmyUI.xcresult" \
            -destination-timeout 60 -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -only-testing:FilmyCameraUITests/FilmyCameraUITests/testCameraShellAndRecipeDetails \
            -only-testing:FilmyCameraUITests/FilmyCameraUITests/testViewfinderFirstChromePreviewKeepsCameraQuiet \
            -only-testing:FilmyCameraUITests/FilmyCameraUITests/testGalleryAndSettingsNavigation \
            -only-testing:FilmyCameraUITests/FilmyCameraUITests/testLandscapeCameraShell \
            -only-testing:FilmyCameraUITests/FilmyCameraUITests/testAccessibilitySizeCameraShellKeepsRecipeControlsReachable \
            -only-testing:FilmyCameraUITests/LaunchOnboardingTests \
            -only-testing:FilmyCameraUITests/LookLibraryUITests \
            test > "$RUNNER_TEMP/ui-evidence/xcodebuild.log" 2>&1
      - name: Export actual screenshots and test results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$RUNNER_TEMP/FilmyUI.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/FilmyUI.xcresult" --output-path "$RUNNER_TEMP/ui-evidence/screenshots"
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/FilmyUI.xcresult" > "$RUNNER_TEMP/ui-evidence/summary.json"
            python3 -c 'import json,sys; s=json.load(open(sys.argv[1])); assert s["passedTests"] == 12 and s["failedTests"] == 0 and s["skippedTests"] == 0, s' "$RUNNER_TEMP/ui-evidence/summary.json"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: filmy-ui-screenshots-${{ matrix.device }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ui-evidence/
          retention-days: 7
          if-no-files-found: error
      - name: Remove only this job's disposable simulator
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/ui-evidence/device-id.txt" ]]; then
            device_id="$(cat "$RUNNER_TEMP/ui-evidence/device-id.txt")"
            xcrun simctl shutdown "$device_id" || true
            xcrun simctl delete "$device_id" || true
          fi
