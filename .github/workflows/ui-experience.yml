name: UI experience evidence

on:
  pull_request:
    paths:
      - 'FilmyCamera/**'
      - 'FilmyCameraUITests/**'
      - 'FilmyCamera.xcodeproj/**'
      - '.github/workflows/ui-experience.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-experience-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui-screenshots:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        device: ["iPhone 16 Pro", "iPad Pro 13-inch (M4)"]
    env:
      SIMULATOR_DEVICE_NAME: ${{ matrix.device }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Capture simulator UI, not a design mockup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ui-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/ui-evidence/source-sha.txt"
          xcodebuild -version > "$RUNNER_TEMP/ui-evidence/xcode.txt"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/ui-evidence/devices.json"
          device_id="$(python3 -c 'import json,sys,os; d=json.load(open(sys.argv[1])); matches=[x["udid"] for key,items in d["devices"].items() if "iOS-26" in key for x in items if x["name"] == os.environ["SIMULATOR_DEVICE_NAME"] and x["isAvailable"]]; print(matches[0] if matches else "")' "$RUNNER_TEMP/ui-evidence/devices.json")"
          [[ -n "$device_id" ]] || { echo "${SIMULATOR_DEVICE_NAME} / iOS 26 simulator required" >&2; exit 1; }
          printf '%s\n' "$device_id" > "$RUNNER_TEMP/ui-evidence/device-id.txt"
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild -project FilmyCamera.xcodeproj -scheme FilmyCamera \
            -destination "platform=iOS Simulator,id=$device_id,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/FilmyUIBuild" \
            -resultBundlePath "$RUNNER_TEMP/FilmyUI.xcresult" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -only-testing:FilmyCameraUITests/FilmyCameraUITests/testCameraShellAndRecipeDetails \
            -only-testing:FilmyCameraUITests/FilmyCameraUITests/testViewfinderFirstChromePreviewKeepsCameraQuiet \
            -only-testing:FilmyCameraUITests/FilmyCameraUITests/testGalleryAndSettingsNavigation \
            -only-testing:FilmyCameraUITests/FilmyCameraUITests/testLandscapeCameraShell \
            -only-testing:FilmyCameraUITests/FilmyCameraUITests/testAccessibilitySizeCameraShellKeepsRecipeControlsReachable \
            -only-testing:FilmyCameraUITests/LaunchOnboardingTests \
            -only-testing:FilmyCameraUITests/LookLibraryUITests \
            test > "$RUNNER_TEMP/ui-evidence/xcodebuild.log" 2>&1
      - name: Export actual screenshots and test results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$RUNNER_TEMP/FilmyUI.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/FilmyUI.xcresult" --output-path "$RUNNER_TEMP/ui-evidence/screenshots"
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/FilmyUI.xcresult" > "$RUNNER_TEMP/ui-evidence/summary.json"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: filmy-ui-screenshots-${{ matrix.device }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ui-evidence/
          retention-days: 7
          if-no-files-found: error
      - name: Shut down only this job's simulator
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/ui-evidence/device-id.txt" ]]; then
            xcrun simctl shutdown "$(cat "$RUNNER_TEMP/ui-evidence/device-id.txt")" || true
          fi
