name: Synchronize recipe persistence project

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  synchronize-project:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'codex/recipe-persistence-recovery'
    runs-on: macos-15
    timeout-minutes: 10
    env:
      XCODEGEN_VERSION: 2.45.4
      XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
      XCODEGEN_BINARY_SHA256: 6aa2b4da95304b343bea12890c59f9655aa428c08b351d57d592cfab4e88a9f1

    steps:
      - name: Check out persistence branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/recipe-persistence-recovery
          fetch-depth: 0

      - name: Install pinned XcodeGen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          archive_path="${RUNNER_TEMP}/xcodegen.zip"
          gh release download "${XCODEGEN_VERSION}" \
            --repo yonaskolb/XcodeGen \
            --pattern xcodegen.zip \
            --output "${archive_path}"
          echo "${XCODEGEN_SHA256}  ${archive_path}" | shasum -a 256 --check
          mkdir -p .ci
          unzip -q "${archive_path}" -d .ci
          xcodegen_path="${GITHUB_WORKSPACE}/.ci/xcodegen/bin/xcodegen"
          [[ -x "${xcodegen_path}" && ! -L "${xcodegen_path}" ]]
          echo "${XCODEGEN_BINARY_SHA256}  ${xcodegen_path}" | shasum -a 256 --check
          grep -Fxq "Version: ${XCODEGEN_VERSION}" <<<"$("${xcodegen_path}" --version 2>&1)"
          echo "${GITHUB_WORKSPACE}/.ci/xcodegen/bin" >> "${GITHUB_PATH}"

      - name: Generate and commit synchronized project
        shell: bash
        run: |
          set -euo pipefail

          xcodegen generate --spec project.yml
          git diff --check
          grep -q 'CameraViewModelPersistenceTests.swift' \
            FilmyCamera.xcodeproj/project.pbxproj

          git rm -- .github/workflows/codex-sync-recipe-project.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- FilmyCamera.xcodeproj
          git commit -m "Synchronize recipe persistence tests"
          git push origin HEAD:codex/recipe-persistence-recovery
