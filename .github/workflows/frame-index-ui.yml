name: Frame Index UI acceptance

on:
  pull_request:
    paths:
      - 'FilmyCamera/**'
      - 'FilmyCameraTests/FrameIndexTests.swift'
      - 'FilmyCameraUITests/**'
      - 'FilmyCamera.xcodeproj/**'
      - '.github/workflows/frame-index-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frame-index-ui-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  small-and-large-iphone:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: ['iPhone SE (3rd generation)', 'iPhone 16 Pro Max']
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      DEVICE_NAME: ${{ matrix.device }}
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Boot a job-owned simulator and test the real native views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/source-sha.txt"
          xcodebuild -version > "$RUNNER_TEMP/evidence/xcode.txt"
          xcrun simctl list devicetypes -j > "$RUNNER_TEMP/evidence/device-types.json"
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/evidence/runtimes.json"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'evidence'
          types = json.loads((out / 'device-types.json').read_text())['devicetypes']
          matches = [d for d in types if d['name'] == os.environ['DEVICE_NAME']]
          if len(matches) != 1:
              raise SystemExit('Requested device type is not installed')
          device = subprocess.check_output(['xcrun','simctl','create', 'Filmy-FrameIndex-' + os.environ['GITHUB_RUN_ID'], matches[0]['identifier'], os.environ['SIMULATOR_RUNTIME']], text=True, timeout=60).strip()
          (out / 'device-id.txt').write_text(device + '\n')
          subprocess.run(['xcrun','simctl','boot',device], check=True, timeout=60)
          subprocess.run(['xcrun','simctl','bootstatus',device,'-b'], check=True, timeout=300)
          PY
          device="$(cat "$RUNNER_TEMP/evidence/device-id.txt")"
          xcodebuild -project FilmyCamera.xcodeproj -scheme FilmyCamera \
            -destination "platform=iOS Simulator,id=$device,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/FrameIndexBuild" \
            -resultBundlePath "$RUNNER_TEMP/FrameIndex.xcresult" \
            -destination-timeout 60 -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -only-testing:FilmyCameraTests/FrameIndexControlPolicyTests \
            -only-testing:FilmyCameraTests/FrameIndexPreviewRenderingTests \
            -only-testing:FilmyCameraUITests/FrameIndexUITests \
            -only-testing:FilmyCameraUITests/LaunchOnboardingTests \
            -only-testing:FilmyCameraUITests/LookLibraryUITests \
            -only-testing:FilmyCameraUITests/FilmyCameraUITests/testCameraShellAndRecipeDetails \
            -only-testing:FilmyCameraUITests/FilmyCameraUITests/testGalleryAndSettingsNavigation \
            test > "$RUNNER_TEMP/evidence/xcodebuild.log" 2>&1
      - name: Export actual screenshot attachments and test results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$RUNNER_TEMP/FrameIndex.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/FrameIndex.xcresult" --output-path "$RUNNER_TEMP/evidence/screenshots"
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/FrameIndex.xcresult" > "$RUNNER_TEMP/evidence/summary.json"
            cat "$RUNNER_TEMP/evidence/summary.json"
            python3 -c 'import json,sys; s=json.load(open(sys.argv[1])); assert s["passedTests"] == 20 and s["failedTests"] == 0 and s["skippedTests"] == 0, s' "$RUNNER_TEMP/evidence/summary.json"
          else
            echo "No xcresult: build or simulator setup did not reach testing" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: frame-index-${{ matrix.device }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: error
      - name: Remove only this job's disposable simulator
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/evidence/device-id.txt" ]]; then
            device="$(cat "$RUNNER_TEMP/evidence/device-id.txt")"
            xcrun simctl shutdown "$device" || true
            xcrun simctl delete "$device" || true
          fi
