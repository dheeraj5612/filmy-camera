name: Runtime hardening native validation

on:
  push:
    branches: [perf/runtime-hardening-20260914]
    paths: [.github/workflows/runtime-hardening-audit.yml]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.repository == 'dheeraj5612/filmy-camera' && github.ref == 'refs/heads/perf/runtime-hardening-20260914'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Verify and apply the audited source patch
        shell: python
        run: |
          import base64
          import hashlib
          import lzma
          import os
          from pathlib import Path
          import subprocess
          payload = ''.join(Path(f'.github/runtime-hardening/payload-{index}.txt').read_text().strip() for index in range(1, 4))
          patch = lzma.decompress(base64.b64decode(payload, validate=True))
          expected = '5381ce191cae99cbce9e15b57920f285c24370cdfdfc88d8ad10736135198194'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Transport digest mismatch'
          paths = []
          for line in patch.decode().splitlines():
              if line.startswith('diff --git '):
                  before, after = line.split()[2:]
                  assert before[2:] == after[2:]
                  name = after[2:]
                  assert '..' not in Path(name).parts
                  assert name.startswith(('FilmyCamera/', 'FilmyCameraTests/', 'docs/hardening/')) or name == 'scripts/testing/suites.json'
                  paths.append(name)
          assert len(paths) == 14, paths
          evidence = Path(os.environ['RUNNER_TEMP']) / 'runtime-hardening'
          evidence.mkdir()
          patch_path = evidence / 'source.patch'
          patch_path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', str(patch_path)], check=True)
      - name: Verify pinned XcodeGen and regenerate project
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download 2.45.4 --repo yonaskolb/XcodeGen --pattern xcodegen.zip --output "${RUNNER_TEMP}/xcodegen.zip"
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  ${RUNNER_TEMP}/xcodegen.zip" | shasum -a 256 --check
          mkdir -p "${RUNNER_TEMP}/xcodegen-tool"
          unzip -q "${RUNNER_TEMP}/xcodegen.zip" -d "${RUNNER_TEMP}/xcodegen-tool"
          generator="${RUNNER_TEMP}/xcodegen-tool/xcodegen/bin/xcodegen"
          echo "6aa2b4da95304b343bea12890c59f9655aa428c08b351d57d592cfab4e88a9f1  ${generator}" | shasum -a 256 --check
          "${generator}" --version
          "${generator}" generate --spec project.yml
          git diff --check
          python3 scripts/testing/run.py inventory > "${RUNNER_TEMP}/runtime-hardening/inventory.txt"
          python3 -m unittest discover -s scripts/testing -p 'test_*.py' -q
          bash scripts/ci/check-tracked-credentials.sh
      - name: Commit only reviewed changes and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/runtime-hardening/payload-{1,2,3}.txt .github/workflows/runtime-hardening-audit.yml
          git add FilmyCamera FilmyCameraTests FilmyCamera.xcodeproj docs/hardening scripts/testing/suites.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bound image work, harden capture recovery, and release inactive preview resources'
          git push origin HEAD:refs/heads/perf/runtime-hardening-20260914
          git rev-parse HEAD | tee "${RUNNER_TEMP}/runtime-hardening/source-sha.txt"
          cp FilmyCamera.xcodeproj/project.pbxproj "${RUNNER_TEMP}/runtime-hardening/project.pbxproj"
          git diff 3d1428ec8497ad6b3836db256cb75145828f5add HEAD -- FilmyCamera FilmyCameraTests FilmyCamera.xcodeproj docs/hardening scripts/testing/suites.json > "${RUNNER_TEMP}/runtime-hardening/published.patch" || true
      - name: Compile and run focused iOS simulator regressions
        id: simulator
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/runtime-hardening"
          xcodebuild -version | tee "${evidence}/xcode-compatibility.txt"
          xcrun simctl list devices available -j > "${evidence}/simulators.json"
          simulator_id="$(python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); devices=[d for runtime,rows in data["devices"].items() if "iOS-18-5" in runtime for d in rows if "iPhone" in d["name"]]; assert devices; print(next((d["udid"] for d in devices if d["name"] == "iPhone 16 Pro"), devices[0]["udid"]))' "${evidence}/simulators.json")"
          destination="platform=iOS Simulator,id=${simulator_id}"
          xcrun simctl boot "${simulator_id}" || true
          xcrun simctl bootstatus "${simulator_id}" -b
          python3 scripts/testing/run.py build --destination "${destination}" --derived-data "${RUNNER_TEMP}/FilmyHardening" --output-dir "${evidence}"
          xcodebuild test-without-building -project FilmyCamera.xcodeproj -scheme FilmyCamera \
            -destination "${destination}" -derivedDataPath "${RUNNER_TEMP}/FilmyHardening" \
            -resultBundlePath "${evidence}/focused.xcresult" -parallel-testing-enabled NO \
            -only-testing:FilmyCameraTests/ImageSizePolicyTests \
            -only-testing:FilmyCameraTests/ImageDecodeQueueTests \
            -only-testing:FilmyCameraTests/RuntimeHardeningTests \
            -only-testing:FilmyCameraTests/PhotoLibraryMetadataTests \
            -only-testing:FilmyCameraTests/CameraViewModelRenderingTests \
            -only-testing:FilmyCameraTests/CameraServiceAvailabilityTests \
            -only-testing:FilmyCameraTests/RendererOutputBoundsTests \
            -only-testing:FilmyCameraTests/PhotoOutputEncoderTests \
            -only-testing:FilmyCameraTests/PhotoPrintCompositorTests \
            CODE_SIGNING_ALLOWED=NO > "${evidence}/focused-tests.log" 2>&1
          tail -50 "${evidence}/focused-tests.log"
      - name: Compile unsigned Release using distribution SDK
        id: release
        continue-on-error: true
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/runtime-hardening"
          xcodebuild -version | tee "${evidence}/xcode-release.txt"
          xcodebuild -project FilmyCamera.xcodeproj -scheme FilmyCamera -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "${RUNNER_TEMP}/FilmyHardeningRelease" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > "${evidence}/release-build.log" 2>&1
          tail -25 "${evidence}/release-build.log"
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: runtime-hardening-native-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-hardening/
          if-no-files-found: warn
          retention-days: 7
      - name: Require both native validation lanes
        if: always()
        env:
          SIMULATOR_RESULT: ${{ steps.simulator.outcome }}
          RELEASE_RESULT: ${{ steps.release.outcome }}
        run: test "$SIMULATOR_RESULT" = success && test "$RELEASE_RESULT" = success
