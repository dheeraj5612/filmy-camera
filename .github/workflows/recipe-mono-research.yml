name: Verify monochromatic recipe settings
on:
  push:
    branches: [feat/recipe-library-packs-fidelity]
    paths: [.github/workflows/recipe-mono-research.yml]
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: complete-public-recipe-settings
          path: /tmp/research
          run-id: 34922509224
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install beautifulsoup4==4.13.4
      - name: Preserve every monochrome camera-setting table field
        run: |
          python - <<'PY'
          import sys, json, hashlib, time
          from pathlib import Path
          from bs4 import BeautifulSoup
          sys.path.insert(0, 'scripts/recipes')
          from collect_public_settings import Fetcher, text
          p = Path('/tmp/research/public-settings-staging.json')
          data = json.loads(p.read_text())
          fetch = Fetcher(1.0)
          accepted = []
          for record in data['records']:
              if 'film.recipes/' not in record['url'] or 'Col. Chr. Effect' in record['settings']:
                  accepted.append(record)
                  continue
              try:
                  payload = fetch.get(record['url'])
                  root = BeautifulSoup(payload, 'html.parser').select_one('.entry-content')
                  blocks = []
                  for table in root.find_all('table'):
                      settings = {}
                      for row in table.find_all('tr'):
                          cells = row.find_all(['td', 'th'])
                          if len(cells) == 2:
                              settings[text(cells[0]).rstrip(':')] = text(cells[1])
                      if len(settings) >= 5 and 'Film Simulation' in settings:
                          blocks.append(settings)
                  if len(blocks) != 1:
                      raise ValueError('Ambiguous complete settings table')
                  record.update(settings=blocks[0], sourceSHA256=hashlib.sha256(payload).hexdigest(), retrievedOn=time.strftime('%Y-%m-%d', time.gmtime()))
                  accepted.append(record)
                  print(record['name'], blocks[0], flush=True)
              except Exception as error:
                  data['failures'].append({'url': record['url'], 'reason': str(error)})
          data['records'] = accepted
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-public-recipe-settings
          path: /tmp/research/
          retention-days: 7
