name: Pro SDK verification
on:
  push:
    branches: [feature/pro-capture-parity]
    paths: [.github/workflows/pro-sdk-probe.yml]
permissions:
  contents: read
jobs:
  sdk:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - name: Inspect installed public camera and Photos APIs
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/pro-sdk"
          mkdir -p "$evidence"
          xcodebuild -version > "$evidence/version.txt"
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          for framework in AVFoundation AVFCapture CoreImage Photos; do
            headers="$sdk/System/Library/Frameworks/$framework.framework/Headers"
            [[ ! -d "$headers" ]] || cp -R "$headers" "$evidence/$framework"
          done
          python3 - "$evidence" <<'PY'
          import pathlib, sys, urllib.request
          base = pathlib.Path(sys.argv[1])
          paths = {
              'tracking-enabled': 'avfoundation/avcapturedevice/iscontinuousautofocustrackingenabled',
              'tracking-supported': 'avfoundation/avcapturedevice/format/iscontinuousautofocustrackingsupported',
              'aperture-min': 'avfoundation/avcapturedevice/format/minlensaperture',
              'aperture-max': 'avfoundation/avcapturedevice/format/maxlensaperture',
              'photo-edit-url': 'photos/phcontenteditingoutput/renderedcontenturl(for:)',
              'photo-edit-types': 'photos/phcontenteditingoutput/supportedrenderedcontenttypes',
              'create-edit-output': 'photos/phcontenteditingoutput/init(placeholderforcreatedasset:)',
          }
          for name, path in paths.items():
              try:
                  url = 'https://developer.apple.com/tutorials/data/documentation/' + path + '.json'
                  (base / (name + '.json')).write_bytes(urllib.request.urlopen(url, timeout=20).read())
              except Exception as e:
                  (base / (name + '-error.txt')).write_text(str(e))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pro-sdk-${{ github.run_id }}
          path: ${{ runner.temp }}/pro-sdk/
          retention-days: 3
