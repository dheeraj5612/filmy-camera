name: Camera polish validation

on:
  push:
    branches: [fix/portrait-capture-gallery-polish]
    paths: ['scripts/camera-polish-transport.txt', '.github/workflows/camera-polish-validation.yml']

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.apply.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/portrait-capture-gallery-polish
          fetch-depth: 0
      - name: Apply verified local source changes only to the isolated branch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code ce88e47ca151f76bf4849cca358017c6ffe5e376 HEAD -- . ':!scripts/camera-polish-transport.txt' ':!.github/workflows/camera-polish-validation.yml'
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          patch = lzma.decompress(base64.b64decode(pathlib.Path('scripts/camera-polish-transport.txt').read_text()))
          assert hashlib.sha256(patch).hexdigest() == '96d782236e8668e00e48364e608b0822af138381df10e4bcf060974766c4901a'
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', '--exclude=.github/workflows/*', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--exclude=.github/workflows/*', '-'], input=patch, check=True)
          source = pathlib.Path('FilmyCameraUITests/FilmyCameraUITests.swift')
          text = source.read_text()
          assert text.count('.portrait-lockedLeft') == 1
          source.write_text(text.replace('.portrait-lockedLeft', '.landscapeLeft'))
          PY
          rm scripts/camera-polish-transport.txt
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'Fix portrait camera startup, automatic saves, focus settling and native Roll paging'
          git push origin HEAD:fix/portrait-capture-gallery-polish
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  native-validation:
    needs: apply
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - name: Compile app and both XCTest targets
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project FilmyCamera.xcodeproj -scheme FilmyCamera -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/FilmyPolish" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build-for-testing > "$RUNNER_TEMP/compile.log" 2>&1 || { tail -150 "$RUNNER_TEMP/compile.log"; exit 1; }
      - name: Run camera save, focus, orientation, print and paging regressions
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project FilmyCamera.xcodeproj -scheme FilmyCamera -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5' -derivedDataPath "$RUNNER_TEMP/FilmyPolish" -resultBundlePath "$RUNNER_TEMP/Polish.xcresult" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -only-testing:FilmyCameraTests/CameraReviewSaveTests -only-testing:FilmyCameraTests/CameraServiceAvailabilityTests -only-testing:FilmyCameraTests/PhotoPrintCompositorTests -only-testing:FilmyCameraUITests/FilmyCameraUITests/testPortraitCameraShellIgnoresDeviceRotation -only-testing:FilmyCameraUITests/FilmyCameraUITests/testCameraShellAndRecipeDetails test-without-building > "$RUNNER_TEMP/tests.log" 2>&1 || { tail -150 "$RUNNER_TEMP/tests.log"; exit 1; }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: camera-polish-native-validation
          path: |
            ${{ runner.temp }}/compile.log
            ${{ runner.temp }}/tests.log
            ${{ runner.temp }}/Polish.xcresult
          retention-days: 7
          if-no-files-found: error
