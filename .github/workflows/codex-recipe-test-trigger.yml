name: Align stale recipe persistence invariant

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-recipe-invariant:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'codex/recipe-persistence-recovery-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out persistence branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/recipe-persistence-recovery-v2
          fetch-depth: 0

      - name: Update and commit stale selection invariant
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path('FilmyCameraTests/RecipeInvariantsTests.swift')
          text = path.read_text(encoding='utf-8')
          old = '''    func testUnknownPersistedSelectionFallsBackToFirstBuiltInRecipe() async {
        UserDefaults.standard.set("recipe-that-no-longer-exists", forKey: selectedRecipeKey)

        let model = await CameraViewModel()
        let persistedID = await model.selectedRecipeID
        let resolvedRecipe = await model.selectedRecipe

        XCTAssertEqual(persistedID, "recipe-that-no-longer-exists")
        XCTAssertEqual(resolvedRecipe, FilmRecipe.builtIns[0])
    }
'''
          new = '''    func testUnknownPersistedSelectionFallsBackToFirstBuiltInRecipe() async {
        UserDefaults.standard.set("recipe-that-no-longer-exists", forKey: selectedRecipeKey)

        let model = await CameraViewModel()
        let fallbackID = FilmRecipe.builtIns[0].id
        let selectedID = await model.selectedRecipeID
        let resolvedRecipe = await model.selectedRecipe
        let rewrittenID = UserDefaults.standard.string(forKey: selectedRecipeKey)

        XCTAssertEqual(selectedID, fallbackID)
        XCTAssertEqual(resolvedRecipe, FilmRecipe.builtIns[0])
        XCTAssertEqual(rewrittenID, fallbackID)
    }
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one stale selection test, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
          grep -q 'XCTAssertEqual(rewrittenID, fallbackID)' \
            FilmyCameraTests/RecipeInvariantsTests.swift

          git rm -- .github/workflows/codex-recipe-test-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- FilmyCameraTests/RecipeInvariantsTests.swift
          git commit -m "Align stale recipe persistence invariant"
          git push origin HEAD:codex/recipe-persistence-recovery-v2
