name: Publish runtime hardening compatibility fixes
on:
  push:
    branches: [perf/runtime-hardening-20260914]
    paths: [.github/workflows/runtime-hardening-compatibility.yml]
permissions:
  contents: write
jobs:
  compatibility:
    if: github.repository == 'dheeraj5612/filmy-camera' && github.ref == 'refs/heads/perf/runtime-hardening-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Apply narrow SDK fixes
        shell: python
        run: |
          from pathlib import Path
          def replace_once(text, before, after):
              assert text.count(before) == 1, before
              return text.replace(before, after, 1)
          path = Path('FilmyCamera/Services/PhotoLibraryService.swift')
          text = path.read_text()
          text = replace_once(text, 'final class PhotoLibraryService: ObservableObject {\n', '''final class PhotoLibraryService: ObservableObject {
              /// Immutable registration ownership; NotificationCenter removal is thread-safe.
              /// Keep non-Sendable Objective-C token access out of the service's actor-isolated lifetime.
              private final class MemoryWarningObservation: @unchecked Sendable {
                  private let token: NSObjectProtocol

                  init(token: NSObjectProtocol) { self.token = token }

                  deinit { NotificationCenter.default.removeObserver(token) }
              }

          ''')
          text = replace_once(text, 'private var memoryWarningObserver: NSObjectProtocol?', 'private var memoryWarningObserver: MemoryWarningObservation?')
          text = replace_once(text, 'memoryWarningObserver = NotificationCenter.default.addObserver(', 'let observer = NotificationCenter.default.addObserver(')
          before = '\n'.join([
              '            MainActor.assumeIsolated { self?.invalidateThumbnailCache() }',
              '        }', '    }', '', '    deinit {', '        if let memoryWarningObserver {',
              '            NotificationCenter.default.removeObserver(memoryWarningObserver)',
              '        }', '    }', ''
          ])
          after = '\n'.join([
              '            MainActor.assumeIsolated { self?.invalidateThumbnailCache() }',
              '        }', '        memoryWarningObserver = MemoryWarningObservation(token: observer)', '    }', ''
          ])
          path.write_text(replace_once(text, before, after))
          path = Path('FilmyCamera/Views/FilteredCameraPreview.swift')
          before = '\n'.join([
              '            if Thread.isMainThread {',
              '                MainActor.assumeIsolated { [weak self] in',
              '                    self?.previewView?.display(image: image)',
              '                }', '            } else {', '                let imageBox = CIImageBox(image)', ''
          ])
          after = '\n'.join([
              '            // Xcode 16.4 does not yet mark immutable CIImage as Sendable.',
              '            let imageBox = CIImageBox(image)', '            if Thread.isMainThread {',
              '                MainActor.assumeIsolated { [weak self] in',
              '                    self?.previewView?.display(image: imageBox.image)',
              '                }', '            } else {', ''
          ])
          path.write_text(replace_once(path.read_text(), before, after))
          path = Path('docs/hardening/runtime-performance-2026-09-14.md')
          path.write_text(replace_once(path.read_text(), 'Per-frame autorelease scope and no extra box on the normal main-thread delivery path.', 'Per-frame autorelease scope; retain the immutable CIImage sendability bridge required by the Xcode 16.4 compatibility lane.'))
      - name: Commit compatibility fixes and remove temporary workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/runtime-hardening-compatibility.yml
          git add FilmyCamera/Services/PhotoLibraryService.swift FilmyCamera/Views/FilteredCameraPreview.swift docs/hardening/runtime-performance-2026-09-14.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Own notification registration safely and retain legacy CIImage bridge'
          git push origin HEAD:refs/heads/perf/runtime-hardening-20260914
          git rev-parse HEAD
