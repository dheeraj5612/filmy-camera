name: Trigger recipe persistence recovery

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-recipe-persistence:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'codex/recipe-persistence-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out persistence branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/recipe-persistence-recovery
          fetch-depth: 0

      - name: Execute audited persistence patch
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'RUNNER'
          from pathlib import Path

          workflow_path = Path(
              '.github/workflows/codex-apply-recipe-persistence.yml'
          )
          workflow = workflow_path.read_text(encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)

          output_lines = []
          inside_swift_literal = False
          for line in workflow[start:end].splitlines():
              if inside_swift_literal:
                  output_lines.append(line)
                  if line.count("'''") % 2 == 1:
                      inside_swift_literal = False
                  continue

              normalized = line[10:] if line.startswith('          ') else line
              output_lines.append(normalized)
              if normalized.count("'''") % 2 == 1:
                  inside_swift_literal = True

          script = '\n'.join(output_lines)
          exec(compile(script, str(workflow_path), 'exec'))
          RUNNER

      - name: Validate generated persistence patch
        shell: bash
        run: |
          set -euo pipefail

          git diff --check
          grep -q 'decodeRecipeOverrides' \
            FilmyCamera/ViewModels/CameraViewModel.swift
          grep -q 'CameraViewModel(defaults: defaults)' \
            FilmyCameraTests/CameraViewModelPersistenceTests.swift
          grep -q 'testCorruptOverrideDoesNotDiscardValidCustomRecipes' \
            FilmyCameraTests/CameraViewModelPersistenceTests.swift

      - name: Commit persistence recovery
        shell: bash
        run: |
          set -euo pipefail

          git rm -- \
            .github/workflows/codex-apply-recipe-persistence.yml \
            .github/workflows/codex-recipe-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            FilmyCamera/ViewModels/CameraViewModel.swift \
            FilmyCameraTests/CameraViewModelPersistenceTests.swift
          git commit -m "Recover persisted recipe state"
          git push origin HEAD:codex/recipe-persistence-recovery
