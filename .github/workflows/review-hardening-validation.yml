name: App Review hardening validation

on:
  push:
    branches: [codex/app-store-hardening-20260910]
    paths: [.github/workflows/review-hardening-validation.yml]

permissions:
  contents: read

concurrency:
  group: review-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.ref == 'refs/heads/codex/app-store-hardening-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Apply one-use test-scroll correction with source verification
        id: source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          path = Path('FilmyCameraUITests/FilmyCameraUITests.swift')
          if hashlib.sha256(path.read_bytes()).hexdigest() != '92592b523ff5a81521612f5e2cad6d0bf403d0a761d5b324cfa32f693fcf2fa2':
              raise SystemExit('Refusing changed UI test source')
          text = path.read_text()
          old = '''        for _ in 0..<8 where !cloudSection.isHittable {
                      content.swipeUp()
                  }
                  XCTAssertTrue(cloudSection.isHittable, "Offline overview must disclose Apple-managed cloud behavior")
          '''
          new = '''        // A full fling can skip this heading inside the shorter iPad sheet.
                  // Use small drags and reverse direction if the target moved above us.
                  for _ in 0..<20 where !cloudSection.isHittable {
                      let viewport = content.frame.intersection(app.frame)
                      let moveDown = cloudSection.exists && cloudSection.frame.midY < viewport.midY
                      let start = content.coordinate(withNormalizedOffset: CGVector(dx: 0.08, dy: moveDown ? 0.45 : 0.75))
                      let end = content.coordinate(withNormalizedOffset: CGVector(dx: 0.08, dy: moveDown ? 0.75 : 0.45))
                      start.press(forDuration: 0.05, thenDragTo: end, withVelocity: .slow, thenHoldForDuration: 0.2)
                  }
                  XCTAssertTrue(cloudSection.isHittable, "Offline overview must disclose Apple-managed cloud behavior")
                  attachScreenshot(named: "privacy-overview-cloud-disclosure")
          '''
          if text.count(old) != 1:
              raise SystemExit('Test correction does not match exactly once')
          path.write_text(text.replace(old, new))
          if hashlib.sha256(path.read_bytes()).hexdigest() != '98d6331664b7448cfef1eeaae4d000044b8b7bc4a6eaea5b2c20ffd1875f427d':
              raise SystemExit('Unexpected corrected test source')
          PY
          git add FilmyCameraUITests/FilmyCameraUITests.swift
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Avoid overshooting privacy disclosure in iPad sheet regression test'
          git push origin HEAD:refs/heads/codex/app-store-hardening-20260910
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 -m unittest discover -s scripts/testing -p 'test_*.py'
          python3 scripts/release/validate-app-review.py
          git diff --check

  simulator:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone 16 Pro
            label: iphone
          - device: iPad Pro 13-inch (M4)
            label: ipad
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - name: Record source provenance
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/review-evidence/source-sha.txt"
          xcodebuild -version > "$RUNNER_TEMP/review-evidence/xcode-version.txt"
          python3 scripts/testing/run.py inventory > "$RUNNER_TEMP/review-evidence/inventory.log"
          python3 scripts/release/validate-app-review.py > "$RUNNER_TEMP/review-evidence/preflight.log"
      - name: Create isolated simulator
        id: simulator
        env:
          DEVICE_PREFIX: ${{ matrix.device }}
        run: |
          set -euo pipefail
          device_type="$(xcrun simctl list devicetypes --json | python3 -c 'import json,os,sys; print(next(d["identifier"] for d in json.load(sys.stdin)["devicetypes"] if d["name"].startswith(os.environ["DEVICE_PREFIX"])))')"
          device="$(xcrun simctl create "Filmy Review ${GITHUB_RUN_ID}" "$device_type" com.apple.CoreSimulator.SimRuntime.iOS-18-5)"
          echo "id=$device" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
      - name: Run native regression tests
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -euo pipefail
          xcodebuild -project FilmyCamera.xcodeproj -scheme FilmyCamera \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/FilmyReviewDerived" \
            -resultBundlePath "$RUNNER_TEMP/review-evidence/review.xcresult" \
            -parallel-testing-enabled NO -maximum-parallel-testing-workers 1 \
            -only-testing:FilmyCameraTests/AppReviewHardeningTests \
            -only-testing:FilmyCameraTests/CameraServiceAvailabilityTests \
            -only-testing:FilmyCameraTests/PhotoLibraryMetadataTests \
            -only-testing:FilmyCameraUITests/FilmyCameraUITests/testOfflinePrivacyOverviewIsReadableAndDismissible \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test \
            > "$RUNNER_TEMP/review-evidence/native-tests.log" 2>&1
      - name: Extract summary and screenshots
        if: always()
        run: |
          result="$RUNNER_TEMP/review-evidence/review.xcresult"
          if [[ -d "$result" ]]; then
            xcrun xcresulttool get test-results summary --path "$result" --format json > "$RUNNER_TEMP/review-evidence/summary.json"
            xcrun xcresulttool export attachments --path "$result" --output-path "$RUNNER_TEMP/review-evidence/screenshots"
          fi
      - name: Delete owned simulator
        if: always() && steps.simulator.outputs.id != ''
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcrun simctl shutdown "$SIMULATOR_ID" || true
          xcrun simctl delete "$SIMULATOR_ID" || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: verified-app-review-${{ matrix.label }}
          path: ${{ runner.temp }}/review-evidence/
          retention-days: 14
          if-no-files-found: warn
