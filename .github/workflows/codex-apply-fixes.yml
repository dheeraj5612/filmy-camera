name: Apply audited reliability fixes

on:
  push:
    branches:
      - codex/camera-gallery-reliability-audit

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out audit branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/camera-gallery-reliability-audit
          fetch-depth: 0

