name: Fix orientation test numeric types

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-orientation-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out orientation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/sensor-aware-camera-orientation
          fetch-depth: 0

      - name: Apply and commit numeric type fix
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path('FilmyCameraTests/CameraServiceAvailabilityTests.swift')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'CGPoint(x: .nan, y: .infinity)': 'CGPoint(x: CGFloat.nan, y: CGFloat.infinity)',
              'rotationAngle: .nan': 'rotationAngle: CGFloat.nan'
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          grep -q 'CGPoint(x: CGFloat.nan, y: CGFloat.infinity)' \
            FilmyCameraTests/CameraServiceAvailabilityTests.swift
          grep -q 'rotationAngle: CGFloat.nan' \
            FilmyCameraTests/CameraServiceAvailabilityTests.swift

          git rm -- .github/workflows/codex-fix-orientation-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- FilmyCameraTests/CameraServiceAvailabilityTests.swift
          git commit -m "Fix orientation test numeric types"
          git push origin HEAD:codex/sensor-aware-camera-orientation
