name: Stage recipe persistence recovery v3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  stage-recovery:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'codex/recipe-persistence-recovery-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out replacement branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/recipe-persistence-recovery-v3
          fetch-depth: 0

      - name: Apply validated persistence diff
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin codex/recipe-persistence-recovery-v2
          git merge --squash origin/codex/recipe-persistence-recovery-v2
          git rm -- .github/workflows/codex-apply-recipe-v3.yml
          git diff --check --cached

          expected_files=(
            FilmyCamera.xcodeproj/project.pbxproj
            FilmyCamera/ViewModels/CameraViewModel.swift
            FilmyCameraTests/CameraViewModelPersistenceTests.swift
            FilmyCameraTests/RecipeInvariantsTests.swift
          )
          mapfile -t changed_files < <(git diff --cached --name-only)
          [[ "${#changed_files[@]}" -eq "${#expected_files[@]}" ]]
          for expected in "${expected_files[@]}"; do
            printf '%s\n' "${changed_files[@]}" | grep -Fxq "${expected}"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Recover persisted recipe state"
          git push origin HEAD:codex/recipe-persistence-recovery-v3
