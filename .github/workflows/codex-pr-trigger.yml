name: Trigger audited reliability fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out audit branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/camera-gallery-reliability-audit
          fetch-depth: 0

      - name: Execute the validated one-time patch
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'RUNNER'
          from pathlib import Path

          workflow_path = Path('.github/workflows/codex-apply-fixes.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()

          normalized_lines = []
          in_raw_string = False
          for line in lines:
              if in_raw_string:
                  normalized_lines.append(line)
                  if line.lstrip().startswith("'''"):
                      in_raw_string = False
                  continue

              normalized = line[10:] if line.startswith("          ") else line
              normalized_lines.append(normalized)
              if "r'''" in normalized and normalized.count("'''") == 1:
                  in_raw_string = True

          script = "\n".join(normalized_lines)
          exec(compile(script, str(workflow_path), 'exec'))
          RUNNER

      - name: Validate generated changes
        shell: bash
        run: |
          set -euo pipefail

          git diff --check
          grep -q 'cancelPendingPhotoOnQueue(status: "Camera temporarily unavailable.")' \
            FilmyCamera/Services/CameraService.swift
          grep -q 'CGImageSourceCreateWithURL' FilmyCamera/Services/PhotoLibraryService.swift
          ! grep -q 'Data(contentsOf: resourceURL)' FilmyCamera/Services/PhotoLibraryService.swift
          grep -q 'task(id: imageRequestKey)' FilmyCamera/Views/GalleryScreen.swift

      - name: Commit audited fixes
        shell: bash
        run: |
          set -euo pipefail

          rm \
            .github/workflows/codex-apply-fixes.yml \
            .github/workflows/codex-pr-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix camera and gallery reliability"
          git push origin HEAD:codex/camera-gallery-reliability-audit
