name: Pro Camera SDK Probe
on:
  push:
    branches: [feat/pro-camera-capture-parity]
    paths: [.github/workflows/pro-camera-sdk-probe.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-15
    steps:
      - name: Inspect installed public SDK declarations
        shell: bash
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          grep -n -A 8 -B 8 -i 'lensAperture\|setAperture\|variableAperture' "$sdk/System/Library/Frameworks/AVFoundation.framework/Headers/AVCaptureDevice.h" || true
          grep -n -A 5 -B 5 'HDRImage\|ExpandToHDR\|expandToHDR\|kCIImageContentHeadroom' "$sdk/System/Library/Frameworks/CoreImage.framework/Headers/CIContext.h" "$sdk/System/Library/Frameworks/CoreImage.framework/Headers/CIImage.h" || true
          grep -n -A 6 -B 4 'livePhotoMovieFileURL\|processedFileType\|rawPhotoDimensions' "$sdk/System/Library/Frameworks/AVFoundation.framework/Headers/AVCapturePhotoOutput.h" || true
