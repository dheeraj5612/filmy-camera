name: Camera catalog acceptance

on:
  pull_request:
    paths:
      - 'FilmyCamera/**'
      - 'FilmyCamera.xcodeproj/**'
      - 'project.yml'
      - 'FilmyCameraTests/**'
      - 'FilmyCameraUITests/**'
      - 'scripts/testing/**'
      - '.github/workflows/catalog-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camera-catalog-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  catalog-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate portable tests and preserve exact acceptance inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/catalog-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/catalog-evidence/source-sha.txt"
          git archive --format=zip HEAD FilmyCamera FilmyCameraTests FilmyCameraUITests FilmyCamera.xcodeproj scripts project.yml .github/workflows README.md docs/testing.md > "$RUNNER_TEMP/catalog-evidence/source.zip"
          python3 -m unittest discover -s scripts/testing -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/catalog-evidence/portable-tests.log"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: filmy-catalog-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/catalog-evidence/
          retention-days: 7
          if-no-files-found: error

  render-every-recipe:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      SIMULATOR_DEVICE_NAME: iPhone 16 Pro
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-2
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Render every production recipe on chart, daylight, and low-light fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/render-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/render-evidence/source-sha.txt"
          xcodebuild -version > "$RUNNER_TEMP/render-evidence/xcode.txt"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/render-evidence/devices.json"
          python3 - <<'PYBOOT'
          import json, os, pathlib, subprocess
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'render-evidence'
          runtime = os.environ['SIMULATOR_RUNTIME']
          devices = json.loads((output / 'devices.json').read_text())['devices']
          matches = [d for d in devices.get(runtime, []) if d['name'] == os.environ['SIMULATOR_DEVICE_NAME'] and d['isAvailable']]
          if len(matches) != 1:
              raise SystemExit('Expected exactly one matching device type on the pinned iOS 26.2 runtime')
          name = 'Filmy-Catalog-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          device_id = subprocess.check_output(['xcrun', 'simctl', 'create', name, matches[0]['deviceTypeIdentifier'], runtime], text=True, timeout=45).strip()
          # This is a newly created, job-owned simulator. Cleanup never touches a caller's device.
          (output / 'device-id.txt').write_text(device_id + '\n')
          (output / 'runtime.txt').write_text(runtime + '\n')
          with (output / 'boot.log').open('w') as log:
              subprocess.run(['xcrun', 'simctl', 'boot', device_id], stdout=log, stderr=subprocess.STDOUT, timeout=45, check=True)
              subprocess.run(['xcrun', 'simctl', 'bootstatus', device_id, '-b'], stdout=log, stderr=subprocess.STDOUT, timeout=300, check=True)
          PYBOOT
          device_id="$(cat "$RUNNER_TEMP/render-evidence/device-id.txt")"
          xcodebuild -project FilmyCamera.xcodeproj -scheme FilmyCamera \
            -destination "platform=iOS Simulator,id=$device_id,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/FilmyCatalogBuild" \
            -resultBundlePath "$RUNNER_TEMP/FilmyCatalog.xcresult" \
            -destination-timeout 60 -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -only-testing:FilmyCameraTests/CatalogRenderAcceptanceTests \
            -only-testing:FilmyCameraTests/CaptureWorkflowPolicyTests \
            -only-testing:FilmyCameraTests/ExpandedCreativeCatalogTests \
            test > "$RUNNER_TEMP/render-evidence/xcodebuild.log" 2>&1
      - name: Export per-recipe contact sheets and require complete execution
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$RUNNER_TEMP/FilmyCatalog.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/FilmyCatalog.xcresult" --output-path "$RUNNER_TEMP/render-evidence/contact-sheets"
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/FilmyCatalog.xcresult" > "$RUNNER_TEMP/render-evidence/summary.json"
            python3 -c 'import json,sys; s=json.load(open(sys.argv[1])); assert s["passedTests"] == 149 and s["failedTests"] == 0 and s["skippedTests"] == 0, s' "$RUNNER_TEMP/render-evidence/summary.json"
          else
            echo "Catalog result bundle is required" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: filmy-catalog-renders-${{ github.run_id }}
          path: ${{ runner.temp }}/render-evidence/
          retention-days: 7
          if-no-files-found: error
      - name: Remove only this job's disposable simulator
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/render-evidence/device-id.txt" ]]; then
            device_id="$(cat "$RUNNER_TEMP/render-evidence/device-id.txt")"
            xcrun simctl shutdown "$device_id" || true
            xcrun simctl delete "$device_id" || true
          fi
