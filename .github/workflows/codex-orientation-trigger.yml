name: Trigger sensor-aware orientation patch

on:
  push:
    branches:
      - codex/sensor-aware-camera-orientation

permissions:
  contents: write

jobs:
  apply-orientation-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out orientation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/sensor-aware-camera-orientation
          fetch-depth: 0

      - name: Execute audited patch
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'RUNNER'
          from pathlib import Path
          import textwrap

          workflow_path = Path('.github/workflows/codex-apply-orientation-fixes.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, str(workflow_path), 'exec'))
          RUNNER

      - name: Validate generated patch
        shell: bash
        run: |
          set -euo pipefail

          git diff --check
          grep -q 'AVCaptureDevice.RotationCoordinator' FilmyCamera/Services/CameraService.swift
          grep -q 'captureDevicePoint' FilmyCamera/Views/CameraScreen.swift
          grep -q 'installPreviewLayer' FilmyCamera/Views/FilteredCameraPreview.swift
          grep -q 'testCaptureDevicePointUndoesCardinalPreviewRotations' \
            FilmyCameraTests/CameraServiceAvailabilityTests.swift

      - name: Commit sensor-aware orientation fixes
        shell: bash
        run: |
          set -euo pipefail

          git rm -- \
            .github/workflows/codex-apply-orientation-fixes.yml \
            .github/workflows/codex-orientation-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            FilmyCamera/Services/CameraService.swift \
            FilmyCamera/Views/CameraScreen.swift \
            FilmyCamera/Views/FilteredCameraPreview.swift \
            FilmyCameraTests/CameraServiceAvailabilityTests.swift
          git commit -m "Use sensor-aware camera rotation"
          git push origin HEAD:codex/sensor-aware-camera-orientation
