name: Pro Camera API Documentation
on:
  push:
    branches: [feat/pro-camera-capture-parity]
    paths: [.github/workflows/pro-camera-api-documentation.yml]
permissions:
  contents: read
jobs:
  public-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Apple exposure documentation
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path
          root = 'https://developer.apple.com/tutorials/data'
          paths = ['/documentation/avfoundation/capture-device-exposure', '/documentation/avfoundation/avcapturedevice/format/supportsexposuremodecustom(lensaperture:duration:iso:)']
          Path('evidence').mkdir()
          for index, path in enumerate(paths):
              try:
                  req = urllib.request.Request(root + path + '.json', headers={'User-Agent': 'FilmyCamera-API-Review'})
                  with urllib.request.urlopen(req, timeout=30) as response: data = json.load(response)
                  Path(f'evidence/document-{index}.json').write_text(json.dumps(data, indent=2))
                  print(json.dumps({k:data.get(k) for k in ['metadata','abstract','primaryContentSections','topicSections']}, indent=2)[:45000])
                  for ref in data.get('references',{}).values():
                      if any(word in str(ref).lower() for word in ['aperture','autoiso','autoexposureduration']):
                          print(json.dumps(ref))
              except Exception as e: print(type(e).__name__, str(e))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pro-camera-api-documentation
          path: evidence
          retention-days: 1
