name: Pro capture workbench

on:
  push:
    branches: [feature/pro-capture-parity]
    paths:
      - .github/workflows/pro-capture-workbench.yml
      - scripts/pro-capture.patch

permissions:
  contents: write

jobs:
  workbench:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feature/pro-capture-parity
          fetch-depth: 1
      - name: Apply verified source patch when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/pro-capture.patch ]]; then
            git apply --check scripts/pro-capture.patch
            git apply scripts/pro-capture.patch
            rm scripts/pro-capture.patch
            brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
            xcodegen generate
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add FilmyCamera FilmyCameraTests FilmyCameraUITests FilmyCamera.xcodeproj project.yml docs scripts
            git commit -m 'Implement capability-aware pro capture, persistent originals and focus tools'
            git push origin HEAD:feature/pro-capture-parity
          fi
      - name: Package exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pro-capture-source"
          git archive HEAD -o "${RUNNER_TEMP}/pro-capture-source/source.tar"
          git rev-parse HEAD > "${RUNNER_TEMP}/pro-capture-source/source-sha.txt"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pro-capture-source-${{ github.run_id }}
          path: ${{ runner.temp }}/pro-capture-source/
          retention-days: 3
      - name: Native build and tests after patch application
        if: ${{ hashFiles('FilmyCamera/Models/ProCaptureSettings.swift') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcodebuild -project FilmyCamera.xcodeproj -scheme FilmyCamera \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "${RUNNER_TEMP}/ProCaptureBuild" \
            CODE_SIGNING_ALLOWED=NO build > "${RUNNER_TEMP}/pro-capture-build.log" 2>&1
      - name: Preserve native validation log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pro-capture-build-${{ github.run_id }}
          path: ${{ runner.temp }}/pro-capture-build.log
          if-no-files-found: ignore
          retention-days: 7
