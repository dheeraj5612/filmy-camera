name: Pro Camera Final Validation
on:
  push:
    branches: [feat/pro-camera-capture-parity]
    paths: [.github/workflows/pro-camera-final-validation.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: macos-15
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/pro-camera-capture-parity
      - name: Apply verified source changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma,subprocess
          p=Path('.pro-camera-patches/final-fixes.b64')
          if p.exists():
              packed=base64.b64decode(p.read_text().strip(),validate=True)
              assert hashlib.sha256(packed).hexdigest()=='2a836823e254f615f828dafc86ad7a29dd322b1cd2c2cb129d2debbf38bfac48'
              patch=lzma.decompress(packed)
              subprocess.run(['git','apply','--check','-'],input=patch,check=True)
              subprocess.run(['git','apply','-'],input=patch,check=True)
              p.unlink()
          PY
      - name: Regenerate project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download 2.45.4 --repo yonaskolb/XcodeGen --pattern xcodegen.zip --output "$RUNNER_TEMP/xcodegen.zip"
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          mkdir -p .ci
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d .ci
          echo '6aa2b4da95304b343bea12890c59f9655aa428c08b351d57d592cfab4e88a9f1  .ci/xcodegen/bin/xcodegen' | shasum -a 256 --check
          .ci/xcodegen/bin/xcodegen generate --spec project.yml
      - id: commit
        name: Commit isolated implementation
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/pro-camera-capture-parity
          git config user.name 'Dheeraj Namburu'
          git config user.email '57207534+dheeraj5612@users.noreply.github.com'
          git add FilmyCamera FilmyCameraTests FilmyCamera.xcodeproj project.yml docs/PRO_CAMERA_FEATURES.md
          if git ls-files .pro-camera-patches | grep -q .; then git add -u .pro-camera-patches; fi
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix: preserve exact MP bounds, recognize ISO HDR and bridge public optical aperture APIs safely'
            git push origin HEAD:feat/pro-camera-capture-parity
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 -m unittest discover -s scripts/testing -p 'test_*.py' -q
  validate:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compatibility
            runner: macos-15
            developer: /Applications/Xcode_16.4.app/Contents/Developer
          - name: release
            runner: macos-15
            developer: /Applications/Xcode_26.3.app/Contents/Developer
          - name: ios27
            runner: xcode-27
            developer: /Applications/Xcode.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: ${{ matrix.developer }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Record compiler and inspect actual HDR encoder
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/evidence/source-sha.txt"
          xcodebuild -version | tee "$RUNNER_TEMP/evidence/xcode.txt"
          cp FilmyCamera.xcodeproj/project.pbxproj "$RUNNER_TEMP/evidence/project.pbxproj"
          python3 - <<'PY'
          from pathlib import Path
          import os
          code=Path('FilmyCamera/Models/ProCaptureOptions.swift').read_text()+'\n'+Path('FilmyCamera/Services/ProPhotoEncoder.swift').read_text()
          code+='''
          struct FilmRecipe { let name = "Fixture" }
          enum PhotoOutputEncoder {
              static let currentApplicationVersion = "1"
              static let currentApplicationBuild = "1"
              static func captureExif(from: Data) -> [String:Any] { [:] }
              static func provenanceJSON(for: FilmRecipe, appVersion: String, appBuild: String) -> String? { nil }
          }
          let rect = CGRect(x:0,y:0,width:128,height:96)
          let sdr = CIImage(color: CIColor(red:0.75,green:0.5,blue:0.25)).cropped(to:rect)
          let expanded = sdr.applyingFilter("CIExposureAdjust",parameters:[kCIInputEVKey:2.0])
          let cg = ProPhotoEncoder.context.createCGImage(expanded,from:rect,format:.RGBAh,colorSpace:CGColorSpace(name:CGColorSpace.extendedSRGB)!)!
          let hdr = CIImage(cgImage:cg,options:[.contentHeadroom:4.0])
          var options=ProCaptureOptions();options.codec = .heif;options.hdr=true
          if let data=ProPhotoEncoder.heifData(image:sdr,sourceSDR:sdr,sourceHDR:hdr,sourceData:Data(),recipe:FilmRecipe(),capturedAt:Date(),options:options) {
              let source=CGImageSourceCreateWithData(data as CFData,nil)!
              print("HDR source headroom:",hdr.contentHeadroom)
              print("Apple gain map:",CGImageSourceCopyAuxiliaryDataInfoAtIndex(source,0,kCGImageAuxiliaryDataTypeHDRGainMap) != nil)
              print("ISO gain map:",CGImageSourceCopyAuxiliaryDataInfoAtIndex(source,0,kCGImageAuxiliaryDataTypeISOGainMap) != nil)
              print("Decoded HDR headroom:",CIImage(data:data,options:[.expandToHDR:true])!.contentHeadroom)
              let destination=URL(fileURLWithPath:ProcessInfo.processInfo.environment["RUNNER_TEMP"]!).appendingPathComponent("evidence/hdr-fixture.heic")
              try data.write(to:destination)
          }
          let large=CIImage(color:.white).cropped(to:CGRect(x:0,y:0,width:8064,height:6048))
          print("24 MP dimensions:",ProPhotoEncoder.sized(large,resolution:.mp24).extent)
          '''
          Path(os.environ['RUNNER_TEMP']+'/hdr-probe.swift').write_text(code)
          PY
          xcrun swift "$RUNNER_TEMP/hdr-probe.swift" > "$RUNNER_TEMP/evidence/hdr-probe.log" 2>&1 || true
          tail -35 "$RUNNER_TEMP/evidence/hdr-probe.log"
      - name: Build physical device camera branches
        run: |
          set -euo pipefail
          xcodebuild -project FilmyCamera.xcodeproj -scheme FilmyCamera -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/Device" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > "$RUNNER_TEMP/evidence/device-build.log" 2>&1 || {
            grep -n -A 5 -B 2 'error:' "$RUNNER_TEMP/evidence/device-build.log" | tail -160
            exit 1
          }
      - name: Run focused capture and retention regressions
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/evidence/simulators.json"
          sdkmajor=$(xcrun --sdk iphonesimulator --show-sdk-version | cut -d. -f1)
          export SDK_MAJOR="$sdkmajor"
          simulator=$(python3 -c 'import json,os; j=json.load(open(os.environ["RUNNER_TEMP"]+"/evidence/simulators.json")); print(next(d["udid"] for key,devices in j["devices"].items() if "iOS-"+os.environ["SDK_MAJOR"]+"-" in key for d in devices if "iPhone" in d["name"] and d.get("isAvailable",False)))')
          xcodebuild -project FilmyCamera.xcodeproj -scheme FilmyCamera -configuration Debug -destination "platform=iOS Simulator,id=$simulator" -derivedDataPath "$RUNNER_TEMP/Simulator" -resultBundlePath "$RUNNER_TEMP/evidence/Tests.xcresult" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -parallel-testing-enabled NO -only-testing:FilmyCameraTests/ProCapturePolicyTests -only-testing:FilmyCameraTests/FilmyPhotoStoreTests -only-testing:FilmyCameraTests/ProPhotoEncoderTests -only-testing:FilmyCameraTests/CameraReviewSaveTests -only-testing:FilmyCameraTests/CameraViewModelRenderingTests -only-testing:FilmyCameraTests/CameraManualControlsTests -only-testing:FilmyCameraTests/PhotoOutputEncoderTests test > "$RUNNER_TEMP/evidence/tests.log" 2>&1 || {
            grep -n -A 5 -B 2 'error:\|failed\|Failure\|fatal' "$RUNNER_TEMP/evidence/tests.log" | tail -160
            exit 1
          }
          tail -25 "$RUNNER_TEMP/evidence/tests.log"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: pro-camera-final-${{ matrix.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          retention-days: 7
