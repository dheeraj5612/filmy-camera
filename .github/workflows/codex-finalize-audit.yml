name: Finalize merged audit series

on:
  push:
    branches:
      - codex/camera-gallery-reliability-audit

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out finalizer branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Merge any remaining audited pull requests, verify main, and clean branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repository="${GITHUB_REPOSITORY}"
          pull_requests=(61 62 63 64 65)

          for pull_number in "${pull_requests[@]}"; do
            for attempt in $(seq 1 90); do
              pull_json="$(gh api "repos/${repository}/pulls/${pull_number}")"
              merged="$(jq -r '.merged')"
              state="$(jq -r '.state')"
              draft="$(jq -r '.draft')"

              if [[ "${merged}" == "true" ]]; then
                echo "PR #${pull_number} is merged."
                break
              fi

              if [[ "${state}" == "closed" ]]; then
                gh api --method PATCH "repos/${repository}/pulls/${pull_number}" \
                  -f state='open' >/dev/null
              fi

              if [[ "${draft}" == "true" ]]; then
                gh pr ready "${pull_number}" --repo "${repository}" >/dev/null
              fi

              merge_http_code="$(
                gh api --silent --include --method PUT \
                  "repos/${repository}/pulls/${pull_number}/merge" \
                  -f merge_method='squash' \
                  -f commit_title="Finalize audited changes (#${pull_number})" \
                  2>/dev/null \
                  | awk 'NR == 1 { print $2 }' \
                  || true
              )"

              if [[ "${merge_http_code}" == "200" ]]; then
                echo "Merged PR #${pull_number}."
                break
              fi

              if (( attempt == 90 )); then
                echo "Timed out waiting to merge PR #${pull_number}." >&2
                gh api "repos/${repository}/pulls/${pull_number}" >&2
                exit 1
              fi

              sleep 20
            done
          done

          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          successful_run_id=""

          for attempt in $(seq 1 90); do
            runs_json="$(
              gh api -X GET \
                "repos/${repository}/actions/runs?branch=main&per_page=50"
            )"

            successful_run_id="$(
              jq -r --arg sha "${main_sha}" '
                .workflow_runs[]
                | select(
                    .head_sha == $sha
                    and .name == "iOS build and tests"
                    and .status == "completed"
                    and .conclusion == "success"
                  )
                | .id
              ' <<<"${runs_json}" | head -n 1
            )"

            if [[ -n "${successful_run_id}" ]]; then
              break
            fi

            failed_conclusion="$(
              jq -r --arg sha "${main_sha}" '
                .workflow_runs[]
                | select(
                    .head_sha == $sha
                    and .name == "iOS build and tests"
                    and .status == "completed"
                    and .conclusion != "success"
                    and .conclusion != "cancelled"
                  )
                | .conclusion
              ' <<<"${runs_json}" | head -n 1
            )"

            if [[ -n "${failed_conclusion}" ]]; then
              echo "Main workflow failed with ${failed_conclusion}." >&2
              exit 1
            fi

            if (( attempt == 90 )); then
              echo "Timed out waiting for the exact main workflow." >&2
              exit 1
            fi

            sleep 20
            git fetch origin main
            main_sha="$(git rev-parse origin/main)"
          done

          echo "Verified main ${main_sha} with workflow ${successful_run_id}."

          branches=(
            codex/camera-gallery-reliability-audit
            codex/filmy-camera-deep-audit-2
            codex/filmy-camera-deep-audit-3
            codex/filmy-camera-deep-audit-4
            codex/release-evidence-build-6
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
              git push origin --delete "${branch}"
            fi
          done
