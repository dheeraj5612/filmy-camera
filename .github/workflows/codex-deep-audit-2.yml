name: Prepare second-pass reliability fixes

on:
  push:
    branches:
      - codex/camera-gallery-reliability-audit

permissions:
  contents: write

jobs:
  prepare-follow-up:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out audit branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Create follow-up branch from merged main and apply audited fixes
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          # PR #61 must already be represented in main before this follow-up
          # branch is created. Compare the affected trees because #61 may have
          # been squash-merged rather than preserving its original commit.
          git diff --quiet origin/main b229bdbe3fc892f30cd7fc56cccb8bf98cafb0f4 -- \
            FilmyCamera/Services/CameraService.swift \
            FilmyCamera/Services/PhotoLibraryService.swift \
            FilmyCamera/ViewModels/CameraViewModel.swift \
            FilmyCamera/Views/CameraScreen.swift \
            FilmyCamera/Views/GalleryScreen.swift \
            FilmyCameraTests/CameraServiceAvailabilityTests.swift \
            FilmyCameraTests/PhotoLibraryMetadataTests.swift || {
              echo "PR #61 is not present in origin/main" >&2
              exit 1
            }

          git checkout -B codex/filmy-camera-deep-audit-2 origin/main

          python3 <<'PY'
          from pathlib import Path
          import re


          def replace_once(relative_path: str, old: str, new: str) -> None:
              path = Path(relative_path)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{relative_path}: expected one replacement target, found {count}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")


          def append_before_final_brace(relative_path: str, addition: str) -> None:
              path = Path(relative_path)
              text = path.read_text(encoding="utf-8")
              if not text.endswith("}\n"):
                  raise SystemExit(f"{relative_path}: unexpected file ending")
              path.write_text(text[:-2] + addition + "}\n", encoding="utf-8")


          replace_once(
              "FilmyCamera/Services/CameraService.swift",
              '''        pendingPhotoCompletion = completion
        pendingPhotoCapturedAt = Date()
        pendingPhotoUniqueID = settings.uniqueID
        pendingPhotoFlashFallback = requestedFlashMode != .off && effectiveFlashMode == .off
        photoOutput.capturePhoto(with: settings, delegate: self)
''',
              '''        let captureUniqueID = settings.uniqueID
        pendingPhotoCompletion = completion
        pendingPhotoCapturedAt = Date()
        pendingPhotoUniqueID = captureUniqueID
        pendingPhotoFlashFallback = requestedFlashMode != .off && effectiveFlashMode == .off
        photoOutput.capturePhoto(with: settings, delegate: self)

        // AVFoundation normally ends every request through its delegate, but
        // a defensive timeout prevents one lost callback from blocking every
        // later shutter press for the lifetime of the camera service.
        sessionQueue.asyncAfter(
            deadline: DispatchTime.now() + DispatchTimeInterval.seconds(30)
        ) { [weak self] in
            guard let self,
                  Self.acceptsPhotoCallback(
                      pendingUniqueID: self.pendingPhotoUniqueID,
                      callbackUniqueID: captureUniqueID
                  ) else {
                return
            }
            self.cancelPendingPhotoOnQueue(
                status: "Photo capture timed out. Try again."
            )
        }
'''
          )

          replace_once(
              "FilmyCamera/Services/CameraService.swift",
              '''            self.finishPhotoOnQueue(capturedPhoto, uniqueID: uniqueID)
        }
    }
}
''',
              '''            self.finishPhotoOnQueue(capturedPhoto, uniqueID: uniqueID)
        }
    }

    public func photoOutput(
        _ output: AVCapturePhotoOutput,
        didFinishCaptureFor resolvedSettings: AVCaptureResolvedPhotoSettings,
        error: Error?
    ) {
        guard output === photoOutput, error != nil else { return }
        let uniqueID = resolvedSettings.uniqueID

        // A terminal capture error can arrive without a processed-photo
        // callback. Clear the matching request immediately so the next shutter
        // press is not rejected as an indefinitely pending capture.
        sessionQueue.async { [weak self] in
            guard let self,
                  Self.acceptsPhotoCallback(
                      pendingUniqueID: self.pendingPhotoUniqueID,
                      callbackUniqueID: uniqueID
                  ) else {
                return
            }
            self.cancelPendingPhotoOnQueue(
                status: "The photo could not be captured. Try again."
            )
        }
    }
}
'''
          )

          replace_once(
              "FilmyCamera/Services/PhotoLibraryService.swift",
              '''    private let savedFrameResourcesKey = "filmyCamera.savedFrameResources"
    private let localFramesDirectoryName = "FilmyCameraFrames"
''',
              '''    private let savedFrameResourcesKey = "filmyCamera.savedFrameResources"
    private let appAlbumIdentifierKey = "filmyCamera.appAlbumIdentifier"
    private let localFramesDirectoryName = "FilmyCameraFrames"
'''
          )

          replace_once(
              "FilmyCamera/Services/PhotoLibraryService.swift",
              '''    private func appAlbum() -> PHAssetCollection? {
        let options = PHFetchOptions()
        options.predicate = NSPredicate(format: "localizedTitle == %@", albumTitle)
        return PHAssetCollection.fetchAssetCollections(
            with: .album,
            subtype: .albumRegular,
            options: options
        ).firstObject
    }

    private var savedAssetIdentifiers: [String] {
''',
              '''    private func appAlbum() -> PHAssetCollection? {
        if let identifier = appAlbumIdentifier {
            if let persistedAlbum = PHAssetCollection.fetchAssetCollections(
                withLocalIdentifiers: [identifier],
                options: nil
            ).firstObject {
                return persistedAlbum
            }
            appAlbumIdentifier = nil
        }

        // Migrate an album created by an older app version only when it
        // actually contains an asset whose identifier this app persisted.
        // A title match alone could otherwise adopt an unrelated user album.
        let ownedIdentifiers = Set(savedAssetIdentifiers)
        guard !ownedIdentifiers.isEmpty else { return nil }

        let options = PHFetchOptions()
        options.predicate = NSPredicate(format: "localizedTitle == %@", albumTitle)
        let candidates = PHAssetCollection.fetchAssetCollections(
            with: .album,
            subtype: .albumRegular,
            options: options
        )

        for candidateIndex in 0..<candidates.count {
            let candidate = candidates.object(at: candidateIndex)
            let candidateAssets = PHAsset.fetchAssets(in: candidate, options: nil)
            for assetIndex in 0..<candidateAssets.count {
                let identifier = candidateAssets.object(at: assetIndex).localIdentifier
                if ownedIdentifiers.contains(identifier) {
                    appAlbumIdentifier = candidate.localIdentifier
                    return candidate
                }
            }
        }
        return nil
    }

    private var appAlbumIdentifier: String? {
        get {
            UserDefaults.standard.string(forKey: appAlbumIdentifierKey)
        }
        set {
            if let newValue, !newValue.isEmpty {
                UserDefaults.standard.set(newValue, forKey: appAlbumIdentifierKey)
            } else {
                UserDefaults.standard.removeObject(forKey: appAlbumIdentifierKey)
            }
        }
    }

    private var savedAssetIdentifiers: [String] {
'''
          )

          replace_once(
              "FilmyCamera/Services/PhotoLibraryService.swift",
              '''                    guard success,
                          let albumIdentifier = albumIdentifierBox.get(),
                          let createdAlbum = PHAssetCollection.fetchAssetCollections(
                              withLocalIdentifiers: [albumIdentifier],
                              options: nil
