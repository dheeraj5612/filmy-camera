          )

          replace_once(
              "FilmyCamera/Services/PhotoLibraryService.swift",
              '''            let attributes = try? FileManager.default.attributesOfItem(atPath: url.path)
            let byteCount = (attributes?[.size] as? NSNumber)?.intValue ?? 0
''',
              '''            let byteCount = (
                try? url.resourceValues(forKeys: [.fileSizeKey]).fileSize
            ) ?? 0
'''
          )

          replace_once(
              "FilmyCamera/ViewModels/CameraViewModel.swift",
              '''@MainActor
final class CameraViewModel: ObservableObject {
''',
              '''enum RecipeSelectionPolicy {
    static func normalizedID(
        _ candidate: String?,
        availableRecipes: [FilmRecipe]
    ) -> String {
        guard let fallbackID = availableRecipes.first?.id else {
            return candidate ?? ""
        }
        guard let candidate,
              availableRecipes.contains(where: { $0.id == candidate }) else {
            return fallbackID
        }
        return candidate
    }
}

@MainActor
final class CameraViewModel: ObservableObject {
'''
          )

          replace_once(
              "FilmyCamera/ViewModels/CameraViewModel.swift",
              '''    @Published var selectedRecipeID: String = UserDefaults.standard.string(forKey: "selectedRecipeID") ?? FilmRecipe.builtIns[0].id {
''',
              '''    @Published var selectedRecipeID: String = RecipeSelectionPolicy.normalizedID(
        UserDefaults.standard.string(forKey: "selectedRecipeID"),
        availableRecipes: FilmRecipe.builtIns
    ) {
'''
          )

          append_before_final_brace(
              "FilmyCameraTests/CameraViewModelRenderingTests.swift",
              '''
    func testRecipeSelectionPolicyPreservesValidAndRepairsRemovedRecipeIDs() {
        let recipes = Array(FilmRecipe.builtIns.prefix(2))
        let validID = recipes[1].id

        XCTAssertEqual(
            RecipeSelectionPolicy.normalizedID(
                validID,
                availableRecipes: recipes
            ),
            validID
        )
        XCTAssertEqual(
            RecipeSelectionPolicy.normalizedID(
                "removed-recipe",
                availableRecipes: recipes
            ),
            recipes[0].id
        )
        XCTAssertEqual(
            RecipeSelectionPolicy.normalizedID(
                nil,
                availableRecipes: recipes
            ),
            recipes[0].id
        )
    }

'''
          )

          project_path = Path("project.yml")
          project_text = project_path.read_text(encoding="utf-8")
          old_version = '    CURRENT_PROJECT_VERSION: "3"'
          if project_text.count(old_version) != 1:
              raise SystemExit("project.yml: unexpected build-version target")
          project_path.write_text(
              project_text.replace(
                  old_version,
                  '    CURRENT_PROJECT_VERSION: "4"',
                  1
              ),
              encoding="utf-8"
          )

          pbxproj_path = Path("FilmyCamera.xcodeproj/project.pbxproj")
          pbxproj_text = pbxproj_path.read_text(encoding="utf-8")
          pbxproj_text, replacement_count = re.subn(
              r"CURRENT_PROJECT_VERSION = 3;",
              "CURRENT_PROJECT_VERSION = 4;",
              pbxproj_text
          )
          if replacement_count < 1:
              raise SystemExit("project.pbxproj: no build-version targets found")
          pbxproj_path.write_text(pbxproj_text, encoding="utf-8")

          checklist_path = Path("docs/release-checklist.md")
          checklist = checklist_path.read_text(encoding="utf-8")
          warning = (
              "> **Submission gate:** Build 3 predates the reliability fixes "
              "now in this repository. Do not submit build 3. Archive and "
              "upload build 4, then select build 4 in App Store Connect before "
              "review.\n"
          )
          if warning not in checklist:
              first_line_end = checklist.find("\n")
              if first_line_end < 0:
                  raise SystemExit("release checklist: missing title line")
              checklist = (
                  checklist[:first_line_end + 1]
                  + "\n"
                  + warning
                  + checklist[first_line_end + 1:]
              )
              checklist_path.write_text(checklist, encoding="utf-8")
          PY

          git diff --check
          grep -q 'Photo capture timed out. Try again.' \
            FilmyCamera/Services/CameraService.swift
          grep -q 'appAlbumIdentifierKey' \
            FilmyCamera/Services/PhotoLibraryService.swift
          ! grep -q 'attributesOfItem(atPath: url.path)' \
            FilmyCamera/Services/PhotoLibraryService.swift
          grep -q 'CURRENT_PROJECT_VERSION: "4"' project.yml
          grep -q 'CURRENT_PROJECT_VERSION = 4;' \
            FilmyCamera.xcodeproj/project.pbxproj

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            FilmyCamera/Services/CameraService.swift \
            FilmyCamera/Services/PhotoLibraryService.swift \
            FilmyCamera/ViewModels/CameraViewModel.swift \
            FilmyCameraTests/CameraViewModelRenderingTests.swift \
            FilmyCamera.xcodeproj/project.pbxproj \
            project.yml \
            docs/release-checklist.md
          git commit -m "Harden capture completion and Photos album ownership"
          git push --force origin HEAD:codex/filmy-camera-deep-audit-2
