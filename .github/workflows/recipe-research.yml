name: Recipe source research
on:
  push:
    branches: [feat/recipe-library-packs-fidelity]
    paths: [.github/workflows/recipe-research.yml]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.4
      - name: Collect public setting facts for review
        run: python scripts/recipes/collect_public_settings.py --output /tmp/research/public-settings-staging.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-recipe-settings
          path: /tmp/research/
          retention-days: 7
