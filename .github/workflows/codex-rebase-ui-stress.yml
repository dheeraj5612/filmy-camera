name: Rebase UI stress pass onto current main

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rebase-ui-stress:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'codex/ui-visual-stress-pass'
    runs-on: macos-15
    timeout-minutes: 12
    env:
      XCODEGEN_VERSION: 2.45.4
      XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
      XCODEGEN_BINARY_SHA256: 6aa2b4da95304b343bea12890c59f9655aa428c08b351d57d592cfab4e88a9f1

    steps:
      - name: Check out UI branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/ui-visual-stress-pass
          fetch-depth: 0

      - name: Rebase UI changes onto current main
        shell: bash
        run: |
          set -euo pipefail

          old_head="$(git rev-parse HEAD)"
          git show "${old_head}:FilmyCamera/Views/RecipePickerView.swift" \
            > "${RUNNER_TEMP}/RecipePickerView.ui.swift"
          git show "${old_head}:FilmyCameraTests/RecipeDetailCommitPolicyTests.swift" \
            > "${RUNNER_TEMP}/RecipeDetailCommitPolicyTests.swift"

          git fetch origin main
          git reset --hard origin/main

          python3 <<'PY'
          from pathlib import Path

          main_path = Path('FilmyCamera/Views/RecipePickerView.swift')
          main_text = main_path.read_text(encoding='utf-8')
          ui_text = Path(
              Path.home().parent.parent
          )
          ui_text = Path(
              __import__('os').environ['RUNNER_TEMP']
          ).joinpath('RecipePickerView.ui.swift').read_text(encoding='utf-8')

          detail_marker = 'struct RecipeDetailView: View {'
          policy_marker = 'enum RecipeDetailCommitAction: Equatable {'
          if main_text.count(detail_marker) != 1:
              raise SystemExit('main RecipeDetailView marker is not unique')
          if ui_text.count(policy_marker) != 1:
              raise SystemExit('UI commit policy marker is not unique')

          prefix = main_text[:main_text.index(detail_marker)]
          suffix = ui_text[ui_text.index(policy_marker):]
          merged = prefix + suffix

          old_scroll = '''                    .onChange(of: selectedRecipeID) { _, newValue in
                        guard !reduceMotion else { return }
                        withAnimation(.snappy(duration: 0.24)) {
                            proxy.scrollTo(newValue, anchor: .center)
                        }
                    }
'''
          new_scroll = '''                    .onChange(of: selectedRecipeID) { _, newValue in
                        if reduceMotion {
                            proxy.scrollTo(newValue, anchor: .center)
                        } else {
                            withAnimation(.snappy(duration: 0.24)) {
                                proxy.scrollTo(newValue, anchor: .center)
                            }
                        }
                    }
'''
          if merged.count(old_scroll) != 1:
              raise SystemExit('reduced-motion scroll target is not unique')
          merged = merged.replace(old_scroll, new_scroll, 1)
          main_path.write_text(merged, encoding='utf-8')

          test_source = Path(
              __import__('os').environ['RUNNER_TEMP']
          ).joinpath('RecipeDetailCommitPolicyTests.swift')
          Path('FilmyCameraTests/RecipeDetailCommitPolicyTests.swift').write_text(
              test_source.read_text(encoding='utf-8'),
              encoding='utf-8'
          )
          PY

      - name: Install pinned XcodeGen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          archive_path="${RUNNER_TEMP}/xcodegen.zip"
          gh release download "${XCODEGEN_VERSION}" \
            --repo yonaskolb/XcodeGen \
            --pattern xcodegen.zip \
            --output "${archive_path}"
          echo "${XCODEGEN_SHA256}  ${archive_path}" | shasum -a 256 --check
          mkdir -p .ci
          unzip -q "${archive_path}" -d .ci
          xcodegen_path="${GITHUB_WORKSPACE}/.ci/xcodegen/bin/xcodegen"
          [[ -x "${xcodegen_path}" && ! -L "${xcodegen_path}" ]]
          echo "${XCODEGEN_BINARY_SHA256}  ${xcodegen_path}" | shasum -a 256 --check
          grep -Fxq "Version: ${XCODEGEN_VERSION}" \
            <<<"$("${xcodegen_path}" --version 2>&1)"
          echo "${GITHUB_WORKSPACE}/.ci/xcodegen/bin" >> "${GITHUB_PATH}"

      - name: Generate, validate, and publish clean branch
        shell: bash
        run: |
          set -euo pipefail

          xcodegen generate --spec project.yml
          git diff --check
          grep -q 'RecipeDetailCommitPolicy' \
            FilmyCamera/Views/RecipePickerView.swift
          grep -q 'recipe-picker' \
            FilmyCamera/Views/RecipePickerView.swift
          grep -q 'testEditingCustomizedDraftRequestsUpdatedCustomization' \
            FilmyCameraTests/RecipeDetailCommitPolicyTests.swift
          grep -q 'RecipeDetailCommitPolicyTests.swift' \
            FilmyCamera.xcodeproj/project.pbxproj

          git rm -- .github/workflows/codex-rebase-ui-stress.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            FilmyCamera.xcodeproj \
            FilmyCamera/Views/RecipePickerView.swift \
            FilmyCameraTests/RecipeDetailCommitPolicyTests.swift
          git commit -m "Stress harden the recipe editor UI"
          git push --force-with-lease origin \
            HEAD:codex/ui-visual-stress-pass
