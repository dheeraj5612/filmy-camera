name: iOS build and tests

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    paths:
      - "FilmyCamera/**"
      - "FilmyCameraTests/**"
      - "FilmyCamera.xcodeproj/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install XcodeGen
        env:
          GH_TOKEN: ${{ github.token }}
          XCODEGEN_VERSION: 2.45.4
          XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
        run: |
          set -euo pipefail

          archive_path="${RUNNER_TEMP}/xcodegen.zip"
          gh release download "${XCODEGEN_VERSION}" \
            --repo yonaskolb/XcodeGen \
            --pattern xcodegen.zip \
            --output "${archive_path}"
          echo "${XCODEGEN_SHA256}  ${archive_path}" | shasum -a 256 --check
          unzip -q "${archive_path}" -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/xcodegen/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/xcodegen/bin/xcodegen" --version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [[ -z "${device_id}" ]]; then
            echo "No available iPhone simulator was found." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi

          echo "device_id=${device_id}" >> "${GITHUB_OUTPUT}"
          xcrun simctl boot "${device_id}" 2>/dev/null || true
          xcrun simctl bootstatus "${device_id}" -b

      - name: Build for iPhone simulator
        shell: bash
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          set -o pipefail
          xcodebuild \
            -project FilmyCamera.xcodeproj \
            -scheme FilmyCamera \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -derivedDataPath "${RUNNER_TEMP}/FilmyCameraDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "${RUNNER_TEMP}/filmycamera-build.log"

      - name: Run XCTest on iPhone simulator
        shell: bash
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          set -o pipefail
          xcodebuild \
            -project FilmyCamera.xcodeproj \
            -scheme FilmyCamera \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -derivedDataPath "${RUNNER_TEMP}/FilmyCameraDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            test | tee "${RUNNER_TEMP}/filmycamera-test.log"

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: filmycamera-xcodebuild-logs
          path: "${{ runner.temp }}/filmycamera-*.log"
          if-no-files-found: warn

      - name: Shut down simulator
        if: always()
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: xcrun simctl shutdown "${DEVICE_ID}" 2>/dev/null || true
