name: iOS build and tests

on:
  push:
    branches:
      - main
    paths:
      - "FilmyCamera/**"
      - "FilmyCameraTests/**"
      - "FilmyCameraUITests/**"
      - "FilmyCamera.xcodeproj/**"
      - "scripts/release/**"
      # App Store metadata is a release input; keep metadata-only commits in
      # the push gate on main.
      - "docs/app-store/**"
      - "docs/release-checklist.md"
      - "project.yml"
      - ".github/workflows/ios-build.yml"
  pull_request: {}
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODEGEN_VERSION: 2.45.4
  XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
  XCODEGEN_BINARY_SHA256: 6aa2b4da95304b343bea12890c59f9655aa428c08b351d57d592cfab4e88a9f1

jobs:
  change-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios_changed: ${{ steps.scope.outputs.ios_changed }}
      release_scripts_changed: ${{ steps.scope.outputs.release_scripts_changed }}

    steps:
      - name: Check out pull request metadata
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether the iOS gate is needed
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${BASE_SHA}"
          else
            base_sha="${PUSH_BASE_SHA}"
          fi

          # Fail open when GitHub does not provide a usable base, such as the
          # first commit on a branch or a manually dispatched run.
          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            echo "ios_changed=true" >> "${GITHUB_OUTPUT}"
            echo "release_scripts_changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_files="$(git diff --name-only "${base_sha}" "${HEAD_SHA}")"
          ios_changed=false
          release_scripts_changed=false

          if grep -Eq '^(FilmyCamera/|FilmyCameraTests/|FilmyCameraUITests/|FilmyCamera\.xcodeproj/|project\.yml$|\.github/workflows/ios-build\.yml$)' <<<"${changed_files}"; then
            ios_changed=true
          fi
          if grep -Eq '^(scripts/release/|project\.yml$|FilmyCamera/Info\.plist$|FilmyCamera/Resources/PrivacyInfo\.xcprivacy$|docs/app-store/|docs/release-checklist\.md$)' <<<"${changed_files}"; then
            release_scripts_changed=true
          fi

          echo "ios_changed=${ios_changed}" >> "${GITHUB_OUTPUT}"
          echo "release_scripts_changed=${release_scripts_changed}" >> "${GITHUB_OUTPUT}"

  build-and-test:
    needs: change-scope
    if: needs.change-scope.outputs.ios_changed == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    # Xcode 16.4 ships iOS 18.5 on the hosted runner. Keep one stable lane so
    # the required `build-and-test` check name does not become a matrix suffix.
    env:
      SIMULATOR_RUNTIME: "iOS 18.5"
      SIMULATOR_DEVICE_NAME: "iPhone 16 Pro"

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Cache XcodeGen
        id: cache-xcodegen
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ci/xcodegen
          key: xcodegen-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODEGEN_VERSION }}-${{ env.XCODEGEN_SHA256 }}-${{ env.XCODEGEN_BINARY_SHA256 }}

      - name: Install XcodeGen
        if: steps.cache-xcodegen.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          archive_path="${RUNNER_TEMP}/xcodegen.zip"
          gh release download "${XCODEGEN_VERSION}" \
            --repo yonaskolb/XcodeGen \
            --pattern xcodegen.zip \
            --output "${archive_path}"
          echo "${XCODEGEN_SHA256}  ${archive_path}" | shasum -a 256 --check
          mkdir -p .ci
          unzip -q "${archive_path}" -d .ci

      - name: Add XcodeGen to PATH and verify pin
        run: |
          set -euo pipefail
          xcodegen_dir="${GITHUB_WORKSPACE}/.ci/xcodegen/bin"
          xcodegen_path="${xcodegen_dir}/xcodegen"
          [[ -x "${xcodegen_path}" && ! -L "${xcodegen_path}" ]] || {
            echo "Pinned XcodeGen executable is missing or is a symlink" >&2
            exit 1
          }
          echo "${XCODEGEN_BINARY_SHA256}  ${xcodegen_path}" | shasum -a 256 --check
          xcodegen_version_output="$("${xcodegen_path}" --version 2>&1)"
          grep -Fxq "Version: ${XCODEGEN_VERSION}" <<<"${xcodegen_version_output}"
          echo "${xcodegen_dir}" >> "${GITHUB_PATH}"

      - name: Select and verify Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_16.4.app/Contents/Developer ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "${GITHUB_ENV}"
          fi
          xcodebuild -version
          [[ "$(xcodebuild -version | awk '/^Xcode / { print $2; exit }')" == "16.4" ]] || {
            echo "The iOS gate requires Xcode 16.4" >&2
            exit 1
          }

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Verify generated project is reproducible
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- FilmyCamera.xcodeproj; then
            echo "XcodeGen changed the committed project; update it intentionally and rerun the gate." >&2
            exit 1
          fi

      - name: Validate release project configuration
        run: scripts/release/validate-project.sh

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          if ! xcrun simctl list runtimes | grep -Fq -- "${SIMULATOR_RUNTIME} ("; then
            echo "Required simulator runtime ${SIMULATOR_RUNTIME} is unavailable on this runner." >&2
            xcrun simctl list runtimes >&2
            exit 1
          fi

          device_id="$(
            xcrun simctl list devices available |
              awk -F '[()]' -v runtime_header="-- ${SIMULATOR_RUNTIME} --" -v wanted_device="${SIMULATOR_DEVICE_NAME}" '
                $0 == runtime_header { in_runtime=1; next }
                in_runtime && /^-- / { in_runtime=0 }
                in_runtime {
                  device_name=$1
                  sub(/^[[:space:]]+/, "", device_name)
                  sub(/[[:space:]]+$/, "", device_name)
                  if (device_name == wanted_device) { print $2; exit }
                }
              '
          )"
          if [[ -z "${device_id}" ]]; then
            echo "No ${SIMULATOR_DEVICE_NAME} simulator was found for ${SIMULATOR_RUNTIME}." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi

          case "$(uname -m)" in
            arm64|x86_64)
              simulator_arch="$(uname -m)"
              ;;
            *)
              echo "Unsupported runner architecture for simulator tests: $(uname -m)" >&2
              exit 1
              ;;
          esac

          {
            echo "device_id=${device_id}"
            echo "simulator_arch=${simulator_arch}"
            echo "destination=platform=iOS Simulator,id=${device_id},arch=${simulator_arch}"
          } >> "${GITHUB_OUTPUT}"
          echo "Using ${SIMULATOR_DEVICE_NAME} on ${SIMULATOR_RUNTIME} simulator ${device_id} (${simulator_arch})"
          xcrun simctl boot "${device_id}" 2>/dev/null || true
          xcrun simctl bootstatus "${device_id}" -b

      - name: Build and run unit tests on iPhone simulator
        shell: bash
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          set -o pipefail
          xcodebuild \
            -project FilmyCamera.xcodeproj \
            -scheme FilmyCamera \
            -destination "${DESTINATION}" \
            -derivedDataPath "${RUNNER_TEMP}/FilmyCameraDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            -enableCodeCoverage NO \
            -resultBundlePath "${RUNNER_TEMP}/FilmyCameraUnit.xcresult" \
            -only-testing:FilmyCameraTests \
            -quiet \
            test 2>&1 | tee "${RUNNER_TEMP}/filmycamera-unit-test.log"

      - name: Run UI tests on iPhone simulator
        shell: bash
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          set -o pipefail
          xcodebuild \
            -project FilmyCamera.xcodeproj \
            -scheme FilmyCamera \
            -destination "${DESTINATION}" \
            -derivedDataPath "${RUNNER_TEMP}/FilmyCameraDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            -enableCodeCoverage NO \
            -resultBundlePath "${RUNNER_TEMP}/FilmyCameraUI.xcresult" \
            -only-testing:FilmyCameraUITests \
            -quiet \
            test 2>&1 | tee "${RUNNER_TEMP}/filmycamera-ui-test.log"

      - name: Record test artifact provenance
        if: always()
        shell: bash
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
          SIMULATOR_ARCH: ${{ steps.simulator.outputs.simulator_arch }}
        run: |
          set -euo pipefail

          provenance_path="${RUNNER_TEMP}/filmycamera-test-provenance.txt"
          xcode_version="$(xcodebuild -version 2>/dev/null | tr '\n' ' ' || true)"
          xcodegen_path="${GITHUB_WORKSPACE}/.ci/xcodegen/bin/xcodegen"
          xcodegen_version="unavailable"
          xcodegen_sha256="unavailable"
          if [[ -x "${xcodegen_path}" ]]; then
            xcodegen_version="$("${xcodegen_path}" --version 2>/dev/null | tr '\n' ' ' || true)"
            xcodegen_sha256="$(shasum -a 256 "${xcodegen_path}" 2>/dev/null | awk '{ print $1 }' || true)"
          fi

          {
            printf 'provenance_schema=1\n'
            printf 'repository=%s\n' "${GITHUB_REPOSITORY}"
            printf 'commit=%s\n' "${GITHUB_SHA}"
            printf 'workflow=%s\n' "${GITHUB_WORKFLOW}"
            printf 'run_id=%s\n' "${GITHUB_RUN_ID}"
            printf 'runner=%s/%s\n' "${RUNNER_OS}" "${RUNNER_ARCH}"
            printf 'xcode=%s\n' "${xcode_version:-unavailable}"
            printf 'developer_dir=%s\n' "${DEVELOPER_DIR:-unavailable}"
            printf 'simulator_runtime=%s\n' "${SIMULATOR_RUNTIME}"
            printf 'simulator_device_name=%s\n' "${SIMULATOR_DEVICE_NAME}"
            printf 'simulator_device_id=%s\n' "${DEVICE_ID:-unavailable}"
            printf 'simulator_arch=%s\n' "${SIMULATOR_ARCH:-unavailable}"
            printf 'xcodegen_version=%s\n' "${xcodegen_version:-unavailable}"
            printf 'xcodegen_sha256=%s\n' "${xcodegen_sha256:-unavailable}"
          } > "${provenance_path}"

          for artifact_path in \
            "${RUNNER_TEMP}/filmycamera-unit-test.log" \
            "${RUNNER_TEMP}/filmycamera-ui-test.log"; do
            if [[ -f "${artifact_path}" ]]; then
              printf 'artifact_sha256=%s:%s\n' \
                "$(basename "${artifact_path}")" \
                "$(shasum -a 256 "${artifact_path}" | awk '{ print $1 }')" \
                >> "${provenance_path}"
            else
              printf 'artifact_missing=%s\n' "$(basename "${artifact_path}")" >> "${provenance_path}"
            fi
          done

          for result_path in \
            "${RUNNER_TEMP}/FilmyCameraUnit.xcresult" \
            "${RUNNER_TEMP}/FilmyCameraUI.xcresult"; do
            if [[ -d "${result_path}" ]]; then
              result_file_count="$(find "${result_path}" -type f | wc -l | tr -d ' ')"
              result_size_kib="$(du -sk "${result_path}" | awk '{ print $1 }')"
              printf 'result_bundle=%s:files=%s:size_kib=%s\n' \
                "$(basename "${result_path}")" "${result_file_count}" "${result_size_kib}" \
                >> "${provenance_path}"
            else
              printf 'result_bundle_missing=%s\n' "$(basename "${result_path}")" >> "${provenance_path}"
            fi
          done

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: filmycamera-xcodebuild-logs
          path: "${{ runner.temp }}/filmycamera-*.log"
          if-no-files-found: warn

      - name: Upload test artifact provenance
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: filmycamera-test-provenance-${{ github.run_id }}
          path: "${{ runner.temp }}/filmycamera-test-provenance.txt"
          if-no-files-found: error

      - name: Upload XCTest result bundle on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: filmycamera-xcresult-${{ github.run_id }}
          path: "${{ runner.temp }}/FilmyCamera*.xcresult"
          if-no-files-found: warn

      - name: Shut down simulator
        if: always()
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: xcrun simctl shutdown "${DEVICE_ID}" 2>/dev/null || true

  release-scripts:
    needs: change-scope
    # This is a required branch-protection context. Run it for every PR so a
    # Swift-only change cannot leave the required check in a skipped state.
    if: needs.change-scope.result == 'success'
    runs-on: macos-15
    timeout-minutes: 10
    env:
      SHELLCHECK_VERSION: "v0.11.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Cache pinned ShellCheck archive
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ci/shellcheck
          key: shellcheck-${{ runner.os }}-${{ runner.arch }}-${{ env.SHELLCHECK_VERSION }}-${{ hashFiles('.github/workflows/ios-build.yml') }}

      - name: Select and verify Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_16.4.app/Contents/Developer ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "${GITHUB_ENV}"
          fi
          xcodebuild -version
          [[ "$(xcodebuild -version | awk '/^Xcode / { print $2; exit }')" == "16.4" ]] || {
            echo "The release-scripts gate requires Xcode 16.4" >&2
            exit 1
          }

      - name: Install pinned ShellCheck
        shell: bash
        run: |
          set -euo pipefail

          shellcheck_version="${SHELLCHECK_VERSION}"
          case "$(uname -m)" in
            arm64)
              shellcheck_archive="shellcheck-${shellcheck_version}.darwin.aarch64.tar.gz"
              shellcheck_sha256="339b930feb1ea764467013cc1f72d09cd6b869ebf1013296ba9055ab2ffbd26f"
              ;;
            x86_64)
              shellcheck_archive="shellcheck-${shellcheck_version}.darwin.x86_64.tar.gz"
              shellcheck_sha256="c2c15e08df0e8fbc374c335b230a7ee958c313fa5714817a59aa59f1aa594f51"
              ;;
            *)
              echo "Unsupported macOS runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          shellcheck_cache_dir="${GITHUB_WORKSPACE}/.ci/shellcheck"
          mkdir -p "${shellcheck_cache_dir}"
          shellcheck_archive_path="${shellcheck_cache_dir}/${shellcheck_archive}"
          if [[ ! -f "${shellcheck_archive_path}" ]]; then
            shellcheck_download_path="${shellcheck_archive_path}.tmp"
            rm -f "${shellcheck_download_path}"
            curl --fail --silent --show-error --location --retry 3 \
              "https://github.com/koalaman/shellcheck/releases/download/${shellcheck_version}/${shellcheck_archive}" \
              --output "${shellcheck_download_path}"
            mv "${shellcheck_download_path}" "${shellcheck_archive_path}"
          fi
          echo "${shellcheck_sha256}  ${shellcheck_archive_path}" | shasum -a 256 --check

          tar -xzf "${shellcheck_archive_path}" -C "${RUNNER_TEMP}"
          shellcheck_bin="${RUNNER_TEMP}/shellcheck-${shellcheck_version}/shellcheck"
          shellcheck_output="$(${shellcheck_bin} --version)"
          grep -Fq "version: ${shellcheck_version#v}" <<<"${shellcheck_output}"
          echo "${RUNNER_TEMP}/shellcheck-${shellcheck_version}" >> "${GITHUB_PATH}"

      - name: Validate release script syntax and safety
        shell: bash
        run: |
          set -euo pipefail

          bash -n scripts/release/*.sh
          shellcheck --severity=warning scripts/release/*.sh
          scripts/release/validate-store-metadata.sh --final
          scripts/release/validate-store-media.sh

          draft_fixture="${RUNNER_TEMP}/filmycamera-draft-metadata.md"
          sed \
            -e 's/^Status:.*/Status: draft/' \
            -e 's/^- \*\*Price:\*\*.*/- **Price:** Confirm with the product owner/' \
            -e 's/^- \*\*Availability:\*\*.*/- **Availability:** Confirm countries\/regions/' \
            docs/app-store/metadata-en-US.md > "${draft_fixture}"

          set +e
          final_metadata_output="$(scripts/release/validate-store-metadata.sh --final "${draft_fixture}" 2>&1)"
          final_metadata_status="$?"
          set -e
          [[ "${final_metadata_status}" -ne 0 ]]
          grep -Fq 'Final App Store metadata' <<<"${final_metadata_output}"

          private_key_regex="$(printf '%s' '-----BEGIN ' '([A-Z0-9]+ )*' 'PRIVATE KEY-----')"
          auth_key_regex="$(printf '%s' 'Auth' 'Key_' '[A-Za-z0-9]{10,}' '\.p8')"
          key_id_regex="$(printf '%s' 'FILMY_ASC_KEY' '_ID=' '[A-Za-z0-9]{10}')"
          issuer_id_regex="$(printf '%s' 'FILMY_ASC_ISSUER' '_ID=' '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}')"
          secret_pattern="${private_key_regex}|${auth_key_regex}|${key_id_regex}|${issuer_id_regex}"
          private_key_prefix="-----BEGIN"
          private_key_suffix=" PRIVATE KEY-----"
          for private_key_modifier in '' OPENSSH RSA EC; do
            private_key_header="${private_key_prefix}${private_key_modifier:+ ${private_key_modifier}}${private_key_suffix}"
            grep -E -q -e "${secret_pattern}" <<<"${private_key_header}" || {
              echo "Credential scan pattern regression for a private-key header; failing closed." >&2
              exit 1
            }
          done
          set +e
          git -c core.pager=cat grep --quiet -I -E -e "${secret_pattern}" -- \
            >/dev/null 2>&1
          secret_scan_status="$?"
          set -e
          case "${secret_scan_status}" in
            0)
              echo "Potential credential material found in tracked release files; match details redacted." >&2
              exit 1
              ;;
            1)
              ;;
            *)
              echo "Credential scan failed closed; match details redacted." >&2
              exit 1
              ;;
          esac

          help_output="$(scripts/release/prepare-upload.sh --help)"
          grep -Fq -- '--check' <<<"${help_output}"
          grep -Fq -- '--upload' <<<"${help_output}"

          ipa_help_output="$(scripts/release/validate-ipa.sh --help)"
          grep -Fq -- '--ipa' <<<"${ipa_help_output}"
          grep -Fq -- '--archive' <<<"${ipa_help_output}"

          set +e
          check_output="$(env -u FILMY_ASC_KEY_ID -u FILMY_ASC_ISSUER_ID -u FILMY_ASC_KEY_PATH scripts/release/prepare-upload.sh --check 2>&1)"
          check_status="$?"
          set -e
          [[ "${check_status}" -ne 0 ]]
          grep -Fq 'no export or upload was attempted' <<<"${check_output}"
