name: iOS build and tests

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    paths:
      - "FilmyCamera/**"
      - "FilmyCameraTests/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [[ -z "${device_id}" ]]; then
            echo "No available iPhone simulator was found." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi

          echo "device_id=${device_id}" >> "${GITHUB_OUTPUT}"
          xcrun simctl boot "${device_id}" 2>/dev/null || true
          xcrun simctl bootstatus "${device_id}" -b

      - name: Build for iPhone simulator
        shell: bash
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          set -o pipefail
          xcodebuild \
            -project FilmyCamera.xcodeproj \
            -scheme FilmyCamera \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -derivedDataPath "${RUNNER_TEMP}/FilmyCameraDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "${RUNNER_TEMP}/filmycamera-build.log"

      - name: Run XCTest on iPhone simulator
        shell: bash
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          set -o pipefail
          xcodebuild \
            -project FilmyCamera.xcodeproj \
            -scheme FilmyCamera \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -derivedDataPath "${RUNNER_TEMP}/FilmyCameraDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            test | tee "${RUNNER_TEMP}/filmycamera-test.log"

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filmycamera-xcodebuild-logs
          path: "${{ runner.temp }}/filmycamera-*.log"
          if-no-files-found: warn

      - name: Shut down simulator
        if: always()
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: xcrun simctl shutdown "${DEVICE_ID}" 2>/dev/null || true
