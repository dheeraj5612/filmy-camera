name: iOS build and tests

on:
  push:
    branches:
      - main
    paths:
      - "FilmyCamera/**"
      - "FilmyCameraTests/**"
      - "FilmyCameraUITests/**"
      - "FilmyCamera.xcodeproj/**"
      - "scripts/release/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "FilmyCamera/**"
      - "FilmyCameraTests/**"
      - "FilmyCameraUITests/**"
      - "FilmyCamera.xcodeproj/**"
      - "scripts/release/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODEGEN_VERSION: 2.45.4
  XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Cache XcodeGen
        id: cache-xcodegen
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ci/xcodegen
          key: xcodegen-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODEGEN_VERSION }}-${{ env.XCODEGEN_SHA256 }}

      - name: Install XcodeGen
        if: steps.cache-xcodegen.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          archive_path="${RUNNER_TEMP}/xcodegen.zip"
          gh release download "${XCODEGEN_VERSION}" \
            --repo yonaskolb/XcodeGen \
            --pattern xcodegen.zip \
            --output "${archive_path}"
          echo "${XCODEGEN_SHA256}  ${archive_path}" | shasum -a 256 --check
          mkdir -p .ci
          unzip -q "${archive_path}" -d .ci

      - name: Add XcodeGen to PATH
        run: |
          set -euo pipefail
          echo "${GITHUB_WORKSPACE}/.ci/xcodegen/bin" >> "${GITHUB_PATH}"
          "${GITHUB_WORKSPACE}/.ci/xcodegen/bin/xcodegen" --version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [[ -z "${device_id}" ]]; then
            echo "No available iPhone simulator was found." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi

          echo "device_id=${device_id}" >> "${GITHUB_OUTPUT}"
          xcrun simctl boot "${device_id}" 2>/dev/null || true
          xcrun simctl bootstatus "${device_id}" -b

      - name: Build and run XCTest on iPhone simulator
        shell: bash
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          set -o pipefail
          xcodebuild \
            -project FilmyCamera.xcodeproj \
            -scheme FilmyCamera \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -derivedDataPath "${RUNNER_TEMP}/FilmyCameraDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            -enableCodeCoverage NO \
            -resultBundlePath "${RUNNER_TEMP}/FilmyCamera.xcresult" \
            -quiet \
            test 2>&1 | tee "${RUNNER_TEMP}/filmycamera-test.log"

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: filmycamera-xcodebuild-logs
          path: "${{ runner.temp }}/filmycamera-*.log"
          if-no-files-found: warn

      - name: Upload XCTest result bundle on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: filmycamera-xcresult
          path: "${{ runner.temp }}/FilmyCamera.xcresult"
          if-no-files-found: warn

      - name: Shut down simulator
        if: always()
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: xcrun simctl shutdown "${DEVICE_ID}" 2>/dev/null || true
