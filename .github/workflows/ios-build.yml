name: iOS build and tests

on:
  push:
    branches:
      - main
    paths:
      - "FilmyCamera/**"
      - "FilmyCameraTests/**"
      - "FilmyCameraUITests/**"
      - "FilmyCamera.xcodeproj/**"
      - "scripts/release/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"
  pull_request: {}
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODEGEN_VERSION: 2.45.4
  XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef

jobs:
  change-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios_changed: ${{ steps.scope.outputs.ios_changed }}
      release_scripts_changed: ${{ steps.scope.outputs.release_scripts_changed }}

    steps:
      - name: Check out pull request metadata
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Determine whether the iOS gate is needed
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "ios_changed=true" >> "${GITHUB_OUTPUT}"
            echo "release_scripts_changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          ios_changed=false
          release_scripts_changed=false

          if grep -Eq '^(FilmyCamera/|FilmyCameraTests/|FilmyCameraUITests/|FilmyCamera\.xcodeproj/|project\.yml$|\.github/workflows/ios-build\.yml$)' <<<"${changed_files}"; then
            ios_changed=true
          fi
          if grep -Eq '^scripts/release/' <<<"${changed_files}"; then
            release_scripts_changed=true
          fi

          echo "ios_changed=${ios_changed}" >> "${GITHUB_OUTPUT}"
          echo "release_scripts_changed=${release_scripts_changed}" >> "${GITHUB_OUTPUT}"

  build-and-test:
    needs: change-scope
    if: needs.change-scope.outputs.ios_changed == 'true'
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Cache XcodeGen
        id: cache-xcodegen
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ci/xcodegen
          key: xcodegen-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODEGEN_VERSION }}-${{ env.XCODEGEN_SHA256 }}

      - name: Install XcodeGen
        if: steps.cache-xcodegen.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          archive_path="${RUNNER_TEMP}/xcodegen.zip"
          gh release download "${XCODEGEN_VERSION}" \
            --repo yonaskolb/XcodeGen \
            --pattern xcodegen.zip \
            --output "${archive_path}"
          echo "${XCODEGEN_SHA256}  ${archive_path}" | shasum -a 256 --check
          mkdir -p .ci
          unzip -q "${archive_path}" -d .ci

      - name: Add XcodeGen to PATH
        run: |
          set -euo pipefail
          echo "${GITHUB_WORKSPACE}/.ci/xcodegen/bin" >> "${GITHUB_PATH}"
          "${GITHUB_WORKSPACE}/.ci/xcodegen/bin/xcodegen" --version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Validate release project configuration
        run: scripts/release/validate-project.sh

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [[ -z "${device_id}" ]]; then
            echo "No available iPhone simulator was found." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi

          echo "device_id=${device_id}" >> "${GITHUB_OUTPUT}"
          xcrun simctl boot "${device_id}" 2>/dev/null || true
          xcrun simctl bootstatus "${device_id}" -b

      - name: Build and run XCTest on iPhone simulator
        shell: bash
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          set -o pipefail
          xcodebuild \
            -project FilmyCamera.xcodeproj \
            -scheme FilmyCamera \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -derivedDataPath "${RUNNER_TEMP}/FilmyCameraDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            -enableCodeCoverage NO \
            -resultBundlePath "${RUNNER_TEMP}/FilmyCamera.xcresult" \
            -quiet \
            test 2>&1 | tee "${RUNNER_TEMP}/filmycamera-test.log"

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: filmycamera-xcodebuild-logs
          path: "${{ runner.temp }}/filmycamera-*.log"
          if-no-files-found: warn

      - name: Upload XCTest result bundle on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: filmycamera-xcresult
          path: "${{ runner.temp }}/FilmyCamera.xcresult"
          if-no-files-found: warn

      - name: Shut down simulator
        if: always()
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: xcrun simctl shutdown "${DEVICE_ID}" 2>/dev/null || true

  release-scripts:
    needs: change-scope
    if: needs.change-scope.outputs.release_scripts_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate release script syntax and safety
        shell: bash
        run: |
          set -euo pipefail

          bash -n scripts/release/*.sh
          shellcheck --severity=warning scripts/release/*.sh

          if git grep -n -I -E -e '-----BEGIN (OPENSSH|RSA|EC|PRIVATE) KEY-----|AuthKey_[A-Za-z0-9]+\.p8|FILMY_ASC_KEY_(ID|PATH)|FILMY_ASC_ISSUER_ID=[^$]' -- \
            ':!scripts/release/prepare-upload.sh'; then
            echo "Potential credential material found in tracked release files." >&2
            exit 1
          fi

          help_output="$(scripts/release/prepare-upload.sh --help)"
          grep -Fq -- '--check' <<<"${help_output}"
          grep -Fq -- '--upload' <<<"${help_output}"

          set +e
          check_output="$(env -u FILMY_ASC_KEY_ID -u FILMY_ASC_ISSUER_ID -u FILMY_ASC_KEY_PATH scripts/release/prepare-upload.sh --check 2>&1)"
          check_status="$?"
          set -e
          [[ "${check_status}" -ne 0 ]]
          grep -Fq 'no export or upload was attempted' <<<"${check_output}"
