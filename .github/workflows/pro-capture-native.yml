name: Native pro capture validation
on:
  push:
    branches: [feature/pro-capture-parity]
    paths: [.github/workflows/pro-capture-native.yml, scripts/pro-capture-fixes.patch]
permissions:
  contents: write
  actions: write
concurrency:
  group: pro-capture-native
  cancel-in-progress: true
jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/pro-capture-parity
      - name: Cancel superseded staging runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel 34925483234 --repo "$GITHUB_REPOSITORY" || true
          gh run cancel 34925398746 --repo "$GITHUB_REPOSITORY" || true
      - name: Apply verified patches and regenerate project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          git archive HEAD -o "$RUNNER_TEMP/evidence/before.tar"
          python3 - <<'PY'
          import base64,gzip,hashlib,json,pathlib,subprocess
          for path in ['scripts/pro-capture.patch','scripts/pro-capture-fixes.patch']:
              p=pathlib.Path(path)
              if not p.exists(): continue
              source=p.read_bytes()
              if source.startswith(b'{'):
                  d=json.loads(source)
                  encoded=d.get('base64_gzip')
                  if encoded is None:
                      encoded=''.join(pathlib.Path(part).read_text().strip() for part in d['parts'])
                  source=gzip.decompress(base64.b64decode(encoded,validate=True))
                  assert hashlib.sha256(source).hexdigest()==d['sha256'], 'Source checksum mismatch: '+path
              patch=pathlib.Path('/tmp/current-pro.patch')
              patch.write_bytes(source)
              subprocess.run(['git','apply','--check',str(patch)],check=True)
              subprocess.run(['git','apply',str(patch)],check=True)
              p.unlink()
          for p in pathlib.Path('scripts').glob('pro-transport-*.b64'): p.unlink()
          PY
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FilmyCamera FilmyCameraTests FilmyCamera.xcodeproj project.yml scripts
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate and harden persistent pro camera pipeline'
            git push origin HEAD:feature/pro-capture-parity
          fi
          git archive HEAD -o "$RUNNER_TEMP/evidence/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/sha.txt"
      - name: Build and test with active iOS 27 SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version | tee "$RUNNER_TEMP/evidence/version.txt"
          xcodebuild -project FilmyCamera.xcodeproj -scheme FilmyCamera -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/build" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/evidence/build.log" 2>&1
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPhone" in d["name"]))')
          xcodebuild -project FilmyCamera.xcodeproj -scheme FilmyCamera -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath "$RUNNER_TEMP/build" -parallel-testing-enabled NO \
            -only-testing:FilmyCameraTests/ProCaptureTests -only-testing:FilmyCameraTests/CameraManualControlsTests \
            -only-testing:FilmyCameraTests/PhotoOutputEncoderTests CODE_SIGNING_ALLOWED=NO test > "$RUNNER_TEMP/evidence/tests.log" 2>&1
      - name: Preserve source and validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-pro-capture-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 7
