name: Native pro capture validation
on:
  push:
    branches: [feature/pro-capture-parity]
    paths: [.github/workflows/pro-capture-native.yml, scripts/pro-capture-fixes.patch]
permissions:
  contents: write
concurrency:
  group: pro-capture-native
  cancel-in-progress: false
jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/pro-capture-parity
      - name: Apply verified patch and regenerate project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          if [[ -f scripts/pro-capture-fixes.patch ]]; then
            git apply --check scripts/pro-capture-fixes.patch
            git apply scripts/pro-capture-fixes.patch
            rm scripts/pro-capture-fixes.patch
          fi
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FilmyCamera FilmyCameraTests FilmyCameraUITests FilmyCamera.xcodeproj project.yml scripts docs
          if ! git diff --cached --quiet; then
            git commit -m 'Fix native pro capture integration and regenerate project'
            git push origin HEAD:feature/pro-capture-parity
          fi
          git archive HEAD -o "$RUNNER_TEMP/evidence/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/sha.txt"
      - name: Build and test available camera API surface
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version | tee "$RUNNER_TEMP/evidence/version.txt"
          ls -d /Applications/Xcode*.app > "$RUNNER_TEMP/evidence/installed-xcodes.txt"
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          api_flag=''
          if grep -R -q 'setExposureModeCustomWithLensAperture:' "$sdk/System/Library/Frameworks/AVFoundation.framework/Headers"; then
            api_flag=FILMY_IOS27_SDK
            echo 'Release camera API branch enabled' | tee "$RUNNER_TEMP/evidence/camera-api-status.txt"
          else
            echo 'Compatibility build only: installed beta SDK predates iOS 27 release camera APIs. Aperture and native priority API branch is NOT compiled or validated.' | tee "$RUNNER_TEMP/evidence/camera-api-status.txt"
          fi
          flags=("FILMY_SDK_CONDITIONS=$api_flag" CODE_SIGNING_ALLOWED=NO)
          xcodebuild -project FilmyCamera.xcodeproj -scheme FilmyCamera -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/build" "${flags[@]}" build > "$RUNNER_TEMP/evidence/build.log" 2>&1
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPhone" in d["name"]))')
          xcodebuild -project FilmyCamera.xcodeproj -scheme FilmyCamera -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath "$RUNNER_TEMP/build" -parallel-testing-enabled NO \
            -only-testing:FilmyCameraTests/ProCaptureTests -only-testing:FilmyCameraTests/CameraManualControlsTests \
            -only-testing:FilmyCameraTests/PhotoOutputEncoderTests "${flags[@]}" test > "$RUNNER_TEMP/evidence/tests.log" 2>&1
      - name: Preserve source and validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-pro-capture-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 7
