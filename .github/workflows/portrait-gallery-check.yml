name: Portrait and gallery regression check
on:
  push:
    branches: [fix/portrait-capture-gallery-polish]
    paths: ['.github/workflows/portrait-gallery-check.yml']
permissions:
  contents: read
jobs:
  repair-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.fix.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/portrait-capture-gallery-polish
      - name: Read both platform-qualified keys from the raw built plist
        id: fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('FilmyCameraTests/CameraServiceAvailabilityTests.swift')
          text = source.read_text()
          before = '    func testAppAndItsInfoPlistAllowOnlyPortrait() {'
          assert text.count(before) == 1
          text = text.replace(before, '    func testAppAndItsInfoPlistAllowOnlyPortrait() throws {')
          before = '        for key in ["UISupportedInterfaceOrientations", "UISupportedInterfaceOrientations~ipad"] {'
          after = '        // Bundle resolves device-qualified keys. Read the built file to verify both device families.\n        let data = try Data(contentsOf: Bundle.main.bundleURL.appendingPathComponent("Info.plist"))\n        let info = try XCTUnwrap(PropertyListSerialization.propertyList(from: data, options: [], format: nil) as? [String: Any])\n' + before
          assert text.count(before) == 1
          text = text.replace(before, after)
          text = text.replace('Bundle.main.object(forInfoDictionaryKey: key) as? [String]', 'info[key] as? [String]')
          text = text.replace('Bundle.main.object(forInfoDictionaryKey: "UIRequiresFullScreen") as? Bool', 'info["UIRequiresFullScreen"] as? Bool')
          source.write_text(text)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FilmyCameraTests/CameraServiceAvailabilityTests.swift
          git commit -m 'Verify portrait configuration against raw built plist device-family keys'
          git push origin HEAD:fix/portrait-capture-gallery-polish
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  native:
    needs: repair-test
    runs-on: macos-15
    timeout-minutes: 18
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.repair-test.outputs.sha }}
          persist-credentials: false
      - name: Boot an owned disposable simulator alongside the build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/polish"
          git rev-parse HEAD > "$RUNNER_TEMP/polish/source-sha.txt"
          device_id=$(xcrun simctl create "Filmy-Polish-$GITHUB_RUN_ID" com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          echo "$device_id" > "$RUNNER_TEMP/polish/device-id.txt"
          xcrun simctl boot "$device_id"
          xcodebuild -project FilmyCamera.xcodeproj -scheme FilmyCamera -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/Build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build-for-testing > "$RUNNER_TEMP/polish/build.log" 2>&1 || { tail -120 "$RUNNER_TEMP/polish/build.log"; exit 1; }
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl addmedia "$device_id" docs/app-store/screenshots/demo-source/cafe-original.png
      - name: Run save, focus, print, portrait, and real Photos paging tests
        env:
          TEST_RUNNER_FILMY_RUN_SEEDED_PHOTOS_E2E: '1'
        shell: bash
        run: |
          set -euo pipefail
          device_id=$(cat "$RUNNER_TEMP/polish/device-id.txt")
          xcodebuild -project FilmyCamera.xcodeproj -scheme FilmyCamera -destination "platform=iOS Simulator,id=$device_id,arch=arm64" -derivedDataPath "$RUNNER_TEMP/Build" -resultBundlePath "$RUNNER_TEMP/polish/Regression.xcresult" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -only-testing:FilmyCameraTests/CameraReviewSaveTests -only-testing:FilmyCameraTests/CameraServiceAvailabilityTests -only-testing:FilmyCameraTests/PhotoPrintCompositorTests -only-testing:FilmyCameraUITests/NormalPhotoFlowTests/testGallerySlidesBetweenSavedPhotosAndPreservesZoomBehavior test-without-building > "$RUNNER_TEMP/polish/tests.log" 2>&1 || { grep -E 'error:|failed|Executed [0-9]+ tests|Failing tests:' "$RUNNER_TEMP/polish/tests.log"; tail -60 "$RUNNER_TEMP/polish/tests.log"; exit 1; }
      - name: Export test evidence
        if: always()
        shell: bash
        run: |
          if [[ -d "$RUNNER_TEMP/polish/Regression.xcresult" ]]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/polish/Regression.xcresult" > "$RUNNER_TEMP/polish/summary.json"
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/polish/Regression.xcresult" --output-path "$RUNNER_TEMP/polish/screenshots"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: portrait-gallery-regression-evidence
          path: ${{ runner.temp }}/polish/
          retention-days: 7
          if-no-files-found: error
      - name: Delete only this run's owned simulator
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/polish/device-id.txt" ]]; then
            device_id=$(cat "$RUNNER_TEMP/polish/device-id.txt")
            xcrun simctl shutdown "$device_id" || true
            xcrun simctl delete "$device_id" || true
          fi
