name: Vivid Slide version invariant synchronization
on:
  push:
    branches: [fix/vivid-slide-red-speckles]
    paths: [.github/workflows/vivid-slide-version-sync.yml]
permissions:
  contents: read
jobs:
  synchronize:
    if: github.repository == 'dheeraj5612/filmy-camera' && github.ref == 'refs/heads/fix/vivid-slide-red-speckles'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/vivid-slide-red-speckles
      - name: Apply exact invariant update and append new research history
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          path = Path('FilmyCameraTests/RecipeInvariantsTests.swift')
          assert subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip() == '0a68b3ca364e37bc688ac6e7e56430b03df1c51d'
          source = path.read_text()
          old = 'XCTAssertEqual(FilmRecipe.rendererVersion, "core-image-parametric-v9")'
          assert source.count(old) == 1
          path.write_text(source.replace(old, 'XCTAssertEqual(FilmRecipe.rendererVersion, "core-image-parametric-v10")'))
          path = Path('docs/research.md')
          assert subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip() == 'cbefb8a1e6e66b1bc0ab07a26dc1620f51aeead8'
          source = path.read_text()
          source += '''
          ## Vivid Slide halation mask correction - 2026-09-11

          Investigation of red speckles in Vivid Slide (`velvia-vivid`) identified
          an unsafe boundary in the shared halation graph. The built-in has grain
          disabled and a halation amount of 0.02. Its highlight extraction can
          produce negative grayscale values, and the old graph converted these
          values with `CIMaskToAlpha` before passing them to `CIBlendWithMask`.

          Apple's [Core Image Filter Reference](https://developer.apple.com/library/archive/documentation/GraphicsImaging/Reference/CoreImageFilterReference/index.html)
          documents the brightness/contrast arithmetic, the alpha-encoded output
          of `CIMaskToAlpha`, and the grayscale input expected by `CIBlendWithMask`.
          The corrected graph retains grayscale coverage, bounds it to `[0, 1]`
          before the Gaussian blur, and extends the mask edges before sampling.
          The palette, red tint, glow strength, and grain settings are unchanged.

          The current renderer version is `core-image-parametric-v10`, which
          invalidates thumbnails generated by the previous pipeline. Version
          references in older dated entries above remain historical records.
          `HalationArtifactRegressionTests` covers individual pixels in software
          and Metal contexts, true highlight glow, preview/photo/export parity,
          finite extended-range output, alpha, grain, and the eight-bit boundary.
          The saved-JPEG test compares the app encoder with an independent ImageIO
          encoding of the same validated frame; two separately rounded inputs
          are not an exact-pixel oracle after lossy compression.

          The original affected photograph and a physical-device reproduction
          were not available for this investigation. This correction addresses
          the identified mask defects without claiming an exact reproduction of
          the reported dots. Device acceptance should inspect neutral detail and
          bright light boundaries in the preview, capture review, and saved JPEG.
          Already-encoded photographs are not rewritten by this change.
          '''
          path.write_text(source)
          PY
          git diff --check
          git add FilmyCameraTests/RecipeInvariantsTests.swift docs/research.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Track renderer v10 in invariants and document halation research'
          git push origin HEAD:refs/heads/fix/vivid-slide-red-speckles
