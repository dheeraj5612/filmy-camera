<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15100d"/>
      <stop offset="0.55" stop-color="#302017"/>
      <stop offset="1" stop-color="#0a0b0e"/>
    </linearGradient>
    <radialGradient id="lens" cx="42%" cy="35%" r="72%">
      <stop offset="0" stop-color="#fff0cf"/>
      <stop offset="0.16" stop-color="#f3a965"/>
      <stop offset="0.34" stop-color="#6d3e37"/>
      <stop offset="0.59" stop-color="#20333e"/>
