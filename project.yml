name: FilmyCamera

options:
  bundleIdPrefix: com.dheeraj
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"
    PRODUCT_BUNDLE_IDENTIFIER: com.dheeraj.filmycamera
    CURRENT_PROJECT_VERSION: "6"
    MARKETING_VERSION: "1.0.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 6ALSCF5GBV
    SUPPORTS_MACCATALYST: NO

targets:
  FilmyCamera:
    type: application
    platform: iOS
    sources:
      - path: FilmyCamera
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: FilmyCamera/Info.plist
      properties:
        CFBundleDisplayName: Filmy Camera
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: Filmy Camera uses the camera to preview and capture photos with your selected film recipe.
        NSPhotoLibraryAddUsageDescription: Filmy Camera saves finished photos to your Photos library when you choose Save to Photos.
        NSPhotoLibraryUsageDescription: Filmy Camera lets you choose existing photos to apply film recipes and reads frames saved by Filmy Camera for the in-app Roll.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      gatherCoverageData: false
      testTargets:
        - FilmyCameraTests
        - FilmyCameraUITests

  FilmyCameraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FilmyCameraTests
    dependencies:
      - target: FilmyCamera
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dheeraj.filmycamera.tests
        TARGETED_DEVICE_FAMILY: "1,2"

  FilmyCameraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FilmyCameraUITests
    dependencies:
      - target: FilmyCamera
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dheeraj.filmycamera.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
