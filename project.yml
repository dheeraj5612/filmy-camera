name: FilmyCamera

options:
  bundleIdPrefix: com.dheeraj
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"
    PRODUCT_BUNDLE_IDENTIFIER: com.dheeraj.filmycamera
    CURRENT_PROJECT_VERSION: "16"
    MARKETING_VERSION: "1.0.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 6ALSCF5GBV
    SUPPORTS_MACCATALYST: NO

schemes:
  FilmyCameraReview:
    build:
      targets:
        FilmyCamera: all
    test:
      config: Debug
      gatherCoverageData: false
      captureScreenshotsAutomatically: true
      deleteScreenshotsWhenEachTestSucceeds: false
      preferredScreenCaptureFormat: screenRecording
      environmentVariables:
        FILMY_RUN_PHYSICAL_REVIEW: "1"
        FILMY_RUN_PHOTOS_WRITE: "1"
        FILMY_RUN_ROLL_QA: "1"
      targets:
        - FilmyCameraUITests

targets:
  FilmyCamera:
    type: application
    platform: iOS
    sources:
      - path: FilmyCamera
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: FilmyCamera/Info.plist
      properties:
        CFBundleDisplayName: Filmy Camera
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMotionUsageDescription: Filmy Camera uses device orientation only to display the optional horizon level. Motion data is not saved or uploaded.
        NSCameraUsageDescription: Filmy Camera uses the camera to preview and capture photos with your selected film recipe.
        NSPhotoLibraryAddUsageDescription: Filmy Camera saves finished photos to your Photos library automatically when you take a picture, or when you save an edited import.
        NSPhotoLibraryUsageDescription: Filmy Camera lets you choose existing photos to apply film recipes and reads frames saved by Filmy Camera for the in-app Roll.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
    scheme:
      gatherCoverageData: false
      testTargets:
        - FilmyCameraTests
        - FilmyCameraUITests

  FilmyCameraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FilmyCameraTests
    dependencies:
      - target: FilmyCamera
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dheeraj.filmycamera.tests
        TARGETED_DEVICE_FAMILY: "1,2"

  FilmyCameraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FilmyCameraUITests
    dependencies:
      - target: FilmyCamera
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dheeraj.filmycamera.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
